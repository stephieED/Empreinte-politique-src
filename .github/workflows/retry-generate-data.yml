name: Retry automatique — generate-data.yml (préemption runner)

# Se déclenche après chaque run (réussi ou non) de "Génération des données"
# (generate-data.yml) et, en cas d'échec, tente de reconnaître la signature
# précise d'une préemption transitoire du runner hébergé GitHub (cause
# retenue pour #217/#221/#228, cf. docs/technical_decisions.md#verification-billing-actions)
# plutôt que de retry aveuglément sur tout échec (#218 : un échec peut aussi
# être un vrai bug applicatif, qu'un retry masquerait au lieu de le signaler).
#
# NOTE : workflow_run ne se déclenche que pour la version du fichier présente
# sur la branche par défaut (restriction GitHub) — ce fichier doit être fusionné
# sur main pour devenir actif.
on:
  workflow_run:
    workflows: ["Génération des données"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  detect-and-retry:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest

    steps:
      # Plafond de 1 tentative automatique : si le run échoué a lui-même été
      # déclenché par ce workflow (identité github-actions[bot] via GITHUB_TOKEN),
      # ne pas re-retenter — évite une boucle coûteuse en cas de préemptions
      # répétées ou de faux positif de détection de signature.
      - name: Vérifier le plafond de retry (1 tentative max)
        id: cap
        env:
          TRIGGERING_ACTOR: ${{ github.event.workflow_run.triggering_actor.login }}
        run: |
          if [[ "$TRIGGERING_ACTOR" == "github-actions[bot]" ]]; then
            echo "already_retried=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_retried=false" >> "$GITHUB_OUTPUT"
          fi

      # Signature de préemption runner (observée sur les runs #24/#25) :
      # au moins un job en échec dont les steps if: always()/if: failure()
      # (Upload artifact *, Diagnostic — job en échec) sont skipped ET dont
      # les logs contiennent le message d'arrêt runner GitHub. Une erreur
      # applicative (exception Python, Quality Gate en échec réel) laisse
      # toujours ces steps s'exécuter normalement (always()/failure() sont
      # évalués), donc ne matche jamais cette signature.
      - name: Détecter la signature de préemption runner
        id: signature
        if: steps.cap.outputs.already_retried == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          jobs_json=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/jobs" --paginate)
          matched=false
          for job_id in $(echo "$jobs_json" | jq -r '.jobs[] | select(.conclusion=="failure") | .id'); do
            skipped_diag=$(echo "$jobs_json" | jq -r --arg jid "$job_id" '
              [.jobs[] | select(.id==($jid|tonumber)) | .steps[]
               | select(.name | test("Upload artifact|Diagnostic")) | select(.conclusion=="skipped")] | length')
            if [[ "$skipped_diag" -gt 0 ]]; then
              log=$(gh api "repos/${REPO}/actions/jobs/${job_id}/logs" 2>/dev/null || true)
              if echo "$log" | grep -qE "shutdown signal|The operation was canceled\."; then
                matched=true
                break
              fi
            fi
          done
          echo "matched=$matched" >> "$GITHUB_OUTPUT"

      # Best-effort : reconstruit les inputs du run échoué à partir des logs
      # (l'API Actions n'expose pas les inputs d'un workflow_dispatch passé).
      # fresh_run est lu de façon fiable via la conclusion du step conditionnel
      # dédié ; les autres valeurs sont extraites du texte résolu des steps
      # (workers/extract_interventions/max_pages, substitués directement par
      # ${{ inputs.* }} dans le script) ou du rapport stdout de check_quality_gate.py
      # (threshold) / generate_all_profiles.py (roster_extraction_limit). En cas
      # d'échec d'extraction d'une valeur, retombe sur le défaut déclaré de
      # generate-data.yml pour cet input (dégradation documentée, pas un blocage).
      - name: Reconstituer les inputs du run échoué (best-effort)
        id: inputs
        if: steps.signature.outputs.matched == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          jobs_json=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/jobs" --paginate)

          job_log() {
            local name="$1"
            local id
            id=$(echo "$jobs_json" | jq -r --arg n "$name" '.jobs[] | select(.name==$n) | .id' | head -1)
            [[ -n "$id" ]] && gh api "repos/${REPO}/actions/jobs/${id}/logs" 2>/dev/null || true
          }

          fresh_run=false
          if echo "$jobs_json" | jq -e '.jobs[] | select(.name=="extract-an") | .steps[]
              | select(.name=="Nettoyage complet (fresh_run uniquement)") | select(.conclusion=="success")' >/dev/null 2>&1; then
            fresh_run=true
          fi

          an_log=$(job_log "extract-an")
          workers=$(echo "$an_log" | grep -oP -- '--workers \K\S+' | head -1)
          extract_interventions=true
          echo "$an_log" | grep -q -- '--skip-interventions' && extract_interventions=false
          max_pages=$(echo "$an_log" | grep -oP -- '--max-pages \K\S+' | head -1)

          gate_log=$(job_log "merge-and-pivot")
          threshold=$(echo "$gate_log" | grep -oP 'Seuil : \K[0-9]+' | head -1)

          roster_log=$(job_log "extract-roster-groupes")
          roster_extraction_limit=$(echo "$roster_log" | grep -oP 'Sélection.*: \K[0-9]+' | head -1)

          echo "fresh_run=${fresh_run}" >> "$GITHUB_OUTPUT"
          echo "threshold=${threshold:-3}" >> "$GITHUB_OUTPUT"
          echo "workers=${workers:-1}" >> "$GITHUB_OUTPUT"
          echo "extract_interventions=${extract_interventions}" >> "$GITHUB_OUTPUT"
          echo "max_pages=${max_pages:-5}" >> "$GITHUB_OUTPUT"
          echo "roster_extraction_limit=${roster_extraction_limit:-20}" >> "$GITHUB_OUTPUT"

      - name: Re-déclencher generate-data.yml
        if: steps.signature.outputs.matched == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh workflow run generate-data.yml \
            --repo "${REPO}" \
            --ref "${{ github.event.workflow_run.head_branch }}" \
            -f fresh_run="${{ steps.inputs.outputs.fresh_run }}" \
            -f threshold="${{ steps.inputs.outputs.threshold }}" \
            -f workers="${{ steps.inputs.outputs.workers }}" \
            -f extract_interventions="${{ steps.inputs.outputs.extract_interventions }}" \
            -f max_pages="${{ steps.inputs.outputs.max_pages }}" \
            -f roster_extraction_limit="${{ steps.inputs.outputs.roster_extraction_limit }}"

      - name: Résumé — trace visible du résultat
        if: always()
        env:
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          {
            if [[ "${{ steps.cap.outputs.already_retried }}" == "true" ]]; then
              echo "### ⏭️ Pas de retry automatique — plafond déjà atteint (1 tentative)"
              echo ""
              echo "Le run échoué (${RUN_URL}) était déjà lui-même une relance automatique."
              echo "Intervention manuelle requise si la préemption runner persiste."
            elif [[ "${{ steps.signature.outputs.matched }}" == "true" ]]; then
              echo "### 🔁 Retry automatique déclenché"
              echo ""
              echo "Le run échoué (${RUN_URL}) correspond à la signature de préemption"
              echo "runner (shutdown signal + steps de diagnostic skipped). Un nouveau"
              echo "\`workflow_dispatch\` de \`generate-data.yml\` a été déclenché automatiquement."
            else
              echo "### ❌ Pas de retry — signature non reconnue"
              echo ""
              echo "Le run échoué (${RUN_URL}) ne correspond pas à la signature de"
              echo "préemption runner : probablement un échec applicatif réel (bug de"
              echo "code, Quality Gate). Pas de retry automatique — investigation"
              echo "manuelle nécessaire (cf. #217)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"