name: Retry automatique — generate-data.yml (préemption runner)

# Se déclenche après chaque run (réussi ou non) de "Génération des données"
# (generate-data.yml) et, en cas d'échec, tente de reconnaître la signature
# précise d'une préemption transitoire du runner hébergé GitHub (cause
# retenue pour #217/#221/#228, cf. docs/technical_decisions.md#verification-billing-actions)
# plutôt que de retry aveuglément sur tout échec (#218 : un échec peut aussi
# être un vrai bug applicatif, qu'un retry masquerait au lieu de le signaler).
#
# NOTE : workflow_run ne se déclenche que pour la version du fichier présente
# sur la branche par défaut (restriction GitHub) — ce fichier doit être fusionné
# sur main pour devenir actif.
#
# Le job est aussi invoqué sur conclusion == 'success' (#245) : un job en
# continue-on-error (extract-roster-groupes, extract-parltrack) peut échouer
# réellement sans faire basculer la conclusion globale du run à 'failure' —
# ce cas ne serait jamais vu si la garde restait limitée à 'failure'. La
# détection au niveau job (step suivant) gère ce cas nativement puisqu'elle
# filtre déjà sur conclusion=="failure" par job, indépendamment de la
# conclusion globale du run.
on:
  workflow_run:
    workflows: ["Génération des données"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  detect-and-retry:
    if: ${{ github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      # Plafond de 1 tentative automatique : si le run échoué a lui-même été
      # déclenché par ce workflow (identité github-actions[bot] via GITHUB_TOKEN),
      # ne pas re-retenter — évite une boucle coûteuse en cas de préemptions
      # répétées ou de faux positif de détection de signature.
      - name: Vérifier le plafond de retry (1 tentative max)
        id: cap
        env:
          TRIGGERING_ACTOR: ${{ github.event.workflow_run.triggering_actor.login }}
        run: |
          if [[ "$TRIGGERING_ACTOR" == "github-actions[bot]" ]]; then
            echo "already_retried=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_retried=false" >> "$GITHUB_OUTPUT"
          fi

      # Signature de préemption runner (observée sur les runs #24/#25) :
      # au moins un job en échec dont les steps if: always()/if: failure()
      # (Upload artifact *, Diagnostic — job en échec) sont skipped ET dont
      # les logs contiennent le message d'arrêt runner GitHub. Une erreur
      # applicative (exception Python, Quality Gate en échec réel) laisse
      # toujours ces steps s'exécuter normalement (always()/failure() sont
      # évalués), donc ne matche jamais cette signature.
      # Distingue quatre issues : signature confirmée (matched=true),
      # détection impossible faute d'avoir pu interroger l'API Actions
      # (api_error / inconclusive=true — jamais à confondre avec une
      # signature absente), signature réellement absente sur des logs
      # effectivement lus (matched=false, api_error=false, inconclusive=false,
      # no_job_failure=false — #237), et run réussi sans aucun job en échec
      # (no_job_failure=true — #245). Ce dernier cas ne peut survenir que
      # lorsque la garde de haut niveau du job est ouverte sur conclusion ==
      # 'success' (ci-dessus) : sans lui, un run 100% vert (aucun job en
      # échec, y compris les jobs continue-on-error) retomberait à tort dans
      # la branche « signature non reconnue » du résumé, qui suggère un bug
      # applicatif à investiguer alors qu'il n'y a eu aucun échec de job.
      # --allow-escape-sequences est requis sur tout appel gh api .../logs
      # de ce fichier (#236) : sans ce flag, gh api échoue silencieusement
      # dès que le log contient des couleurs ANSI (quasi systématique),
      # ce qui a rendu ce mécanisme inopérant sur les runs #26-28 sans
      # jamais le signaler — cf. docs/technical_decisions.md#retry-preemption-logs.
      - name: Détecter la signature de préemption runner
        id: signature
        if: steps.cap.outputs.already_retried == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          matched=false
          api_error=false
          inconclusive=false
          no_job_failure=false

          if ! jobs_json=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/jobs" --paginate 2>/tmp/gh_jobs_err.log); then
            echo "::warning::Échec de récupération de la liste des jobs (run ${RUN_ID}) : $(cat /tmp/gh_jobs_err.log)"
            api_error=true
          else
            failed_job_count=$(echo "$jobs_json" | jq -r '[.jobs[] | select(.conclusion=="failure")] | length')
            if [[ "$WORKFLOW_CONCLUSION" == "success" && "$failed_job_count" -eq 0 ]]; then
              no_job_failure=true
            else
              for job_id in $(echo "$jobs_json" | jq -r '.jobs[] | select(.conclusion=="failure") | .id'); do
                skipped_diag=$(echo "$jobs_json" | jq -r --arg jid "$job_id" '
                  [.jobs[] | select(.id==($jid|tonumber)) | .steps[]
                   | select(.name | test("Upload artifact|Diagnostic")) | select(.conclusion=="skipped")] | length')
                if [[ "$skipped_diag" -gt 0 ]]; then
                  if ! log=$(gh api "repos/${REPO}/actions/jobs/${job_id}/logs" --allow-escape-sequences 2>/tmp/gh_log_err.log); then
                    echo "::warning::Échec de récupération du log du job ${job_id} : $(cat /tmp/gh_log_err.log)"
                    inconclusive=true
                    continue
                  fi
                  if echo "$log" | grep -qE "shutdown signal|The operation was canceled\."; then
                    matched=true
                    break
                  fi
                fi
              done
            fi
          fi

          echo "matched=$matched" >> "$GITHUB_OUTPUT"
          echo "api_error=$api_error" >> "$GITHUB_OUTPUT"
          echo "inconclusive=$inconclusive" >> "$GITHUB_OUTPUT"
          echo "no_job_failure=$no_job_failure" >> "$GITHUB_OUTPUT"

      # Best-effort : reconstruit les inputs du run échoué à partir des logs
      # (l'API Actions n'expose pas les inputs d'un workflow_dispatch passé).
      # fresh_run est lu de façon fiable via la conclusion du step conditionnel
      # dédié ; les autres valeurs sont extraites du texte résolu des steps
      # (workers/extract_interventions/max_pages, substitués directement par
      # ${{ inputs.* }} dans le script) ou du rapport stdout de check_quality_gate.py
      # (threshold) / generate_all_profiles.py (roster_extraction_limit). En cas
      # d'échec d'extraction d'une valeur, retombe sur le défaut déclaré de
      # generate-data.yml pour cet input (dégradation documentée, pas un blocage).
      #
      # job_log() exclut les lignes ##[debug] : ce dépôt tourne avec le
      # logging de debug activé, et le log brut d'un step contenant plusieurs
      # ${{ }} contient alors AUSSI le texte du template GitHub Actions non
      # résolu (ex. littéralement "--workers {3}", émis par
      # "##[debug]Evaluating format(...)") avant la ligne "Run ..." réellement
      # résolue. Sans ce filtre, `grep | head -1` peut capturer ce
      # placeholder au lieu de la vraie valeur — régression constatée sur un
      # run réel : "{3}"/"{2})" transmis tels quels au workflow_dispatch de
      # relance, faisant planter extract-senat/extract-ue-officiel avec
      # "invalid int value: '{3}'". Inoffensif pour gate_log/roster_log (leurs
      # motifs ne visent que du stdout applicatif, jamais préfixé ##[debug]).
      - name: Reconstituer les inputs du run échoué (best-effort)
        id: inputs
        if: steps.signature.outputs.matched == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          jobs_json=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/jobs" --paginate)

          job_log() {
            local name="$1"
            local id
            id=$(echo "$jobs_json" | jq -r --arg n "$name" '.jobs[] | select(.name==$n) | .id' | head -1)
            [[ -n "$id" ]] || return 0
            gh api "repos/${REPO}/actions/jobs/${id}/logs" --allow-escape-sequences 2>/dev/null | grep -v '##\[debug\]' || true
          }

          fresh_run=false
          if echo "$jobs_json" | jq -e '.jobs[] | select(.name=="extract-an") | .steps[]
              | select(.name=="Nettoyage complet (fresh_run uniquement)") | select(.conclusion=="success")' >/dev/null 2>&1; then
            fresh_run=true
          fi

          an_log=$(job_log "extract-an")
          # Ancré sur la ligne de commande finale ("--source an --workers N")
          # pour éviter tout autre match fortuit, et restreint à [0-9]+ (pas
          # \S+) pour qu'une valeur inattendue échoue la validation ci-dessous
          # plutôt que d'être transmise telle quelle. `|| true` : sous
          # `set -e`/`pipefail`, un grep sans match (job_log vide, motif
          # absent) ferait sinon avorter tout le step ici — perdant du même
          # coup les valeurs suivantes, correctement extractibles, plutôt que
          # de dégrader uniquement celle en cause vers son défaut.
          workers=$(echo "$an_log" | grep -oP -- '--source an --workers \K[0-9]+' | head -1) || true
          [[ "$workers" =~ ^[0-9]+$ ]] || workers=""

          # Le texte source "--skip-interventions" est toujours présent dans
          # le script échoué, que la condition ait été vraie ou non à
          # l'exécution (GitHub échoue le SOURCE bash substitué, pas la trace
          # d'exécution) : chercher sa seule présence donnerait donc toujours
          # vrai. On lit à la place la valeur substituée de
          # ${{ inputs.extract_interventions }} directement dans la
          # condition `[[ "<valeur>" != "true" ]]`.
          extract_interventions=$(echo "$an_log" | grep -oP -- '\[\[ "\K(true|false)(?=" != "true" \]\] && INTERV_FLAG)' | head -1) || true
          [[ "$extract_interventions" == "true" || "$extract_interventions" == "false" ]] || extract_interventions=false

          max_pages=$(echo "$an_log" | grep -oP -- '--max-pages \K[0-9]+' | head -1) || true
          [[ "$max_pages" =~ ^[0-9]+$ ]] || max_pages=""

          gate_log=$(job_log "merge-and-pivot")
          threshold=$(echo "$gate_log" | grep -oP 'Seuil : \K[0-9]+' | head -1) || true
          [[ "$threshold" =~ ^[0-9]+$ ]] || threshold=""

          roster_log=$(job_log "extract-roster-groupes")
          roster_extraction_limit=$(echo "$roster_log" | grep -oP 'Sélection.*: \K[0-9]+' | head -1) || true
          [[ "$roster_extraction_limit" =~ ^[0-9]+$ ]] || roster_extraction_limit=""

          echo "fresh_run=${fresh_run}" >> "$GITHUB_OUTPUT"
          echo "threshold=${threshold:-3}" >> "$GITHUB_OUTPUT"
          echo "workers=${workers:-1}" >> "$GITHUB_OUTPUT"
          echo "extract_interventions=${extract_interventions}" >> "$GITHUB_OUTPUT"
          echo "max_pages=${max_pages:-5}" >> "$GITHUB_OUTPUT"
          echo "roster_extraction_limit=${roster_extraction_limit:-20}" >> "$GITHUB_OUTPUT"

      - name: Re-déclencher generate-data.yml
        if: steps.signature.outputs.matched == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh workflow run generate-data.yml \
            --repo "${REPO}" \
            --ref "${{ github.event.workflow_run.head_branch }}" \
            -f fresh_run="${{ steps.inputs.outputs.fresh_run }}" \
            -f threshold="${{ steps.inputs.outputs.threshold }}" \
            -f workers="${{ steps.inputs.outputs.workers }}" \
            -f extract_interventions="${{ steps.inputs.outputs.extract_interventions }}" \
            -f max_pages="${{ steps.inputs.outputs.max_pages }}" \
            -f roster_extraction_limit="${{ steps.inputs.outputs.roster_extraction_limit }}"

      - name: Résumé — trace visible du résultat
        if: always()
        env:
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          {
            if [[ "${{ steps.cap.outputs.already_retried }}" == "true" ]]; then
              echo "### ⏭️ Pas de retry automatique — plafond déjà atteint (1 tentative)"
              echo ""
              echo "Le run (${RUN_URL}) était déjà lui-même une relance automatique."
              echo "Intervention manuelle requise si la préemption runner persiste."
            elif [[ "${{ steps.signature.outputs.matched }}" == "true" ]]; then
              echo "### 🔁 Retry automatique déclenché"
              echo ""
              echo "Le run (${RUN_URL}) a un job en échec (\`conclusion: failure\`,"
              echo "éventuellement un job \`continue-on-error\` sans impact sur la conclusion"
              echo "globale) qui correspond à la signature de préemption runner (shutdown"
              echo "signal + steps de diagnostic skipped). Un nouveau \`workflow_dispatch\`"
              echo "de \`generate-data.yml\` a été déclenché automatiquement."
            elif [[ "${{ steps.signature.outputs.no_job_failure }}" == "true" ]]; then
              echo "### ✅ Run réussi sans échec de job — rien à signaler"
              echo ""
              echo "Le run (${RUN_URL}) s'est terminé avec la conclusion \`success\` et"
              echo "aucun job ne rapporte \`conclusion: failure\` (y compris les jobs en"
              echo "\`continue-on-error\` comme \`extract-roster-groupes\`/\`extract-parltrack\`)."
              echo "Aucune action nécessaire."
            elif [[ "${{ steps.signature.outputs.api_error }}" == "true" || "${{ steps.signature.outputs.inconclusive }}" == "true" || "${{ steps.signature.outcome }}" == "failure" ]]; then
              echo "### ⚠️ Détection impossible — erreur API, vérifier manuellement le run"
              echo ""
              echo "La détection de la signature de préemption sur le run"
              echo "(${RUN_URL}) n'a pas pu être menée à terme : erreur lors de l'appel à"
              echo "l'API GitHub Actions (listing des jobs et/ou récupération d'un log)."
              echo "Ce n'est **pas** un signal de bug applicatif — voir les"
              echo "\`::warning::\` de ce job pour le détail de l'erreur API, et vérifier"
              echo "manuellement le run."
            else
              echo "### ❌ Pas de retry — signature non reconnue"
              echo ""
              echo "Le run (${RUN_URL}) a au moins un job en échec (\`conclusion: failure\`,"
              echo "éventuellement un job \`continue-on-error\` sans impact sur la conclusion"
              echo "globale) qui ne correspond pas à la signature de préemption runner :"
              echo "probablement un échec applicatif réel (bug de code, Quality Gate)."
              echo "Pas de retry automatique — investigation manuelle nécessaire (cf. #217)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"