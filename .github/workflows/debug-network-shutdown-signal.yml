name: Debug — isolation du shutdown signal (volume vs domaine)

# Workflow de diagnostic isolé, hors pipeline de production : ne touche à
# aucune donnée du dépôt (pas de checkout de données, pas de commit, pas
# d'artifact) et ne dépend d'aucun job de generate-data.yml. Objectif :
# tester si le "shutdown signal" observé sur extract-an/extract-roster-groupes
# (voir docs/technical_decisions.md#resilience-generate-data-shutdown-signal
# et #228) est corrélé au volume/à la durée d'activité réseau soutenue
# depuis le runner (indépendamment de la destination), ou spécifique à
# nosdeputes.fr — en comparant, à volume de requêtes identique, un groupe
# "nosdeputes.fr" à un groupe témoin vers un domaine différent
# (api.github.com : infra a priori très fiable, tout gel là-bas serait très
# significatif).
#
# Le phénomène est probabiliste (jamais 100% des runs concernés en
# production) : un seul dispatch à un palier de volume donné ne suffit pas à
# conclure. Lancer plusieurs fois à chaque palier avant de monter au palier
# suivant.
#
# requests (pas urllib.request de la stdlib) : même client HTTP que
# candidate_profile.py::_get_payload en production (même comportement
# TLS/connexion), pour reproduire les conditions le plus fidèlement possible.
# Pas de retry ni de watchdog ici — volontaire : on veut observer le
# comportement brut (un hang non protégé), pas le comportement déjà durci
# du pipeline de production.

on:
  workflow_dispatch:
    inputs:
      request_count:
        description: >
          Nombre de requêtes séquentielles par groupe (nosdeputes.fr et
          témoin), à la même URL à chaque fois (isole la variable "volume",
          sans mélanger avec un effet de rotation de domaine). Monter
          progressivement (5, 15, 30...) sur plusieurs dispatches.
        type: number
        default: 20
      delay_seconds:
        description: >
          Pause entre deux requêtes (secondes) — se rapproche du rythme réel
          de generate_all_profiles.py (pauses de courtoisie API, 0.2-0.5s
          selon l'appel).
        type: number
        default: 0.3

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # GROUPE TEST — requêtes répétées vers nosdeputes.fr (synthese/data/json :
  # endpoint retiré du pipeline de production depuis #356 — fetch_activity_synthesis
  # n'existe plus — conservé ici comme URL de test à volume/latence connus et
  # stables — voir docs/technical_decisions.md#get-payload-retry).
  # ──────────────────────────────────────────────────────────────────────────
  nosdeputes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - name: Horodatage de démarrage (diagnostic annulation/échec)
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: Requêtes séquentielles vers nosdeputes.fr
        env:
          PYTHONUNBUFFERED: "1"
          REQUEST_COUNT: ${{ inputs.request_count }}
          DELAY_SECONDS: ${{ inputs.delay_seconds }}
        run: |
          python3 - <<'PYEOF'
          import os
          import time

          import requests

          URL = "https://www.nosdeputes.fr/synthese/data/json"
          HEADERS = {"User-Agent": "candidate-profile-script/0.1 (usage personnel / non commercial)"}
          n = int(os.environ["REQUEST_COUNT"])
          delay = float(os.environ["DELAY_SECONDS"])

          for i in range(1, n + 1):
              start = time.monotonic()
              print(f"[{i}/{n}] -> {URL}")
              try:
                  resp = requests.get(URL, headers=HEADERS, timeout=15)
                  elapsed = time.monotonic() - start
                  print(f"[{i}/{n}]    OK — HTTP {resp.status_code}, {len(resp.content)} octets, {elapsed:.1f}s")
              except requests.RequestException as exc:
                  elapsed = time.monotonic() - start
                  print(f"[{i}/{n}]    ERREUR après {elapsed:.1f}s : {exc}")
              time.sleep(delay)

          print(f"Terminé sans blocage — {n} requête(s) envoyée(s).")
          PYEOF

      - name: Diagnostic — job annulé (signal externe)
        if: cancelled()
        run: |
          ELAPSED_MIN=$(( ($(date +%s) - ${JOB_START_EPOCH:-$(date +%s)}) / 60 ))
          {
            echo "### ⚠️ Job annulé — signal d'annulation externe"
            echo ""
            echo "Annulé après ~${ELAPSED_MIN} min, sans erreur applicative visible dans les"
            echo "logs précédents — signature identique au \`shutdown signal\` observé sur"
            echo "extract-an/extract-roster-groupes."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnostic — job en échec
        if: failure()
        run: echo "### ❌ Job en échec (voir logs)" >> "$GITHUB_STEP_SUMMARY"

  # ──────────────────────────────────────────────────────────────────────────
  # GROUPE TÉMOIN — même volume/rythme de requêtes, mais vers api.github.com
  # plutôt que nosdeputes.fr. Si ce groupe gèle aussi (même à volume élevé),
  # ça pointe vers un phénomène générique lié au runner/à une durée d'activité
  # réseau soutenue, pas vers nosdeputes.fr spécifiquement.
  # ──────────────────────────────────────────────────────────────────────────
  domaine-temoin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - name: Horodatage de démarrage (diagnostic annulation/échec)
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: Requêtes séquentielles vers api.github.com (domaine témoin)
        env:
          PYTHONUNBUFFERED: "1"
          REQUEST_COUNT: ${{ inputs.request_count }}
          DELAY_SECONDS: ${{ inputs.delay_seconds }}
        run: |
          python3 - <<'PYEOF'
          import os
          import time

          import requests

          URL = "https://api.github.com/repos/stephieED/Empreinte-politique-src"
          HEADERS = {"User-Agent": "candidate-profile-script/0.1 (usage personnel / non commercial)"}
          n = int(os.environ["REQUEST_COUNT"])
          delay = float(os.environ["DELAY_SECONDS"])

          for i in range(1, n + 1):
              start = time.monotonic()
              print(f"[{i}/{n}] -> {URL}")
              try:
                  resp = requests.get(URL, headers=HEADERS, timeout=15)
                  elapsed = time.monotonic() - start
                  print(f"[{i}/{n}]    OK — HTTP {resp.status_code}, {len(resp.content)} octets, {elapsed:.1f}s")
              except requests.RequestException as exc:
                  elapsed = time.monotonic() - start
                  print(f"[{i}/{n}]    ERREUR après {elapsed:.1f}s : {exc}")
              time.sleep(delay)

          print(f"Terminé sans blocage — {n} requête(s) envoyée(s).")
          PYEOF

      - name: Diagnostic — job annulé (signal externe)
        if: cancelled()
        run: |
          ELAPSED_MIN=$(( ($(date +%s) - ${JOB_START_EPOCH:-$(date +%s)}) / 60 ))
          {
            echo "### ⚠️ Job annulé — signal d'annulation externe"
            echo ""
            echo "Annulé après ~${ELAPSED_MIN} min, sans erreur applicative visible dans les"
            echo "logs précédents — signature identique au \`shutdown signal\` observé sur"
            echo "extract-an/extract-roster-groupes."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnostic — job en échec
        if: failure()
        run: echo "### ❌ Job en échec (voir logs)" >> "$GITHUB_STEP_SUMMARY"
