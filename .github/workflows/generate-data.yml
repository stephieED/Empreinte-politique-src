name: Génération des données

on:
  #schedule:
  #  - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      fresh_run:
        description: >
          Démarrage à froid — purge complète des sorties et du cache,
          génération sans fusion, quality gate à tolérance zéro.
          false = mode incrémental résilient (fusion additive, cache restauré, seuil souple).
        type: boolean
        default: false
      threshold:
        description: >
          Seuil IncompleteRead (soft fail). Appliqué dans tous les modes,
          y compris fresh_run=true. Défaut : 3.
        type: number
        default: 3
      workers:
        description: >
          Nombre de workers parallèles pour generate_all_profiles.py
          (candidats traités simultanément). Défaut : 1 (séquentiel).
        type: number
        default: 1
      extract_interventions:
        description: >
          Extraire les interventions dans extract-an (débats officiels Syceron en
          source primaire, avec fallback recherche NosDéputés + questions officielles AN
          si Syceron indisponible pour le candidat/législature).
          false (défaut) = skip interventions, extraction plus rapide.
        type: boolean
        default: false
      max_pages:
        description: >
          Pages max. de recherche NosDéputés par candidat (50 résultats/page,
          utilisé seulement en fallback si Syceron ne retourne rien).
          Ignoré si extract_interventions=false. Défaut : 5.
        type: number
        default: 5
      roster_extraction_limit:
        description: >
          Déploiement progressif de l'extraction roster-driven (#190, job
          extract-roster-groupes) : ne traiter que les N premiers membres du
          roster (raw_data/roster_candidats.json, ordre déterministe --limit).
          Défaut : 20 (rollout manuel à petite échelle, cf. #192). Budget
          mesuré (#376/#392) : ~5 s par membre, soit 1,7 min à 20, 25 min à
          300, 59 min à 700. Le timeout de 60 min couvre ~712 des 752 membres
          du roster : une montée progressive jusqu'à ~700 est donc possible
          sans rien changer d'autre. 0 = pas de limite : ~63 min, au-dessus du
          timeout — exige le découpage en shards de #394 (et reste une
          décision produit, #192).
        type: number
        default: 20

# Nécessaire pour que le job puisse pousser la mise à jour des données.
permissions:
  contents: write

# Évite deux exécutions qui écriraient/committeraient en même temps.
concurrency:
  group: generate-data
  cancel-in-progress: false

# ─────────────────────────────────────────────────────────────────────────────
# Timeout ParlTrack : modifiable ici (30 min par défaut). Rappel : ce job a
# continue-on-error: true — son dépassement ne bloque pas merge-and-pivot.
# extract-an (#344) : matrix strategy, un shard par candidat à slug résolvable
# (raw_data/candidats.json, calculé par le job prepare-an-matrix) — isole la
# perte en cas de shutdown signal runner (#228, angle mort de if: always()) à
# un seul candidat au lieu de tout le job. max-parallel: 1 sur ce matrix :
# préserve le pic de jobs simultanés à 4 déjà acté par #222/[[concurrence-ci-roster]]
# (des shards en parallèle entre eux, en plus de Sénat/UE/ParlTrack déjà
# concurrents, dépasseraient ce pic) — voir
# docs/technical_decisions.md#matrix-extract-an-par-candidat.
# Timeouts : amendements-an 30 min / AN 5 min par shard (réduit de 20 min,
# voir commentaire sur extract-an ci-dessous), shards exécutés en série
# (max-parallel 1) → ≈ 5 × nb_candidats_a_slug (8 actuellement, donc ≈40 min
# pire cas — recalculer si raw_data/candidats.json change significativement)
# / Sénat 90 min / UE 60 min / ParlTrack 30 min / roster-groupes 60 min
# (needs: les jobs d'extraction précédents, #222 — jamais parallèle à eux,
# contrairement à ce qu'un calcul purement parallèle suggérerait) /
# merge-and-pivot 60 min (needs: roster-groupes entre autres).
# Total mur (parallèle) ≈ max(30+5×8, 90, 60, 30) + 60 + 60 = 190 min pire cas
# (8 shards, contre 310 min avec le timeout de 20 min par shard) — contre
# bien plus de 450 min si tout s'enchaînait séquentiellement.
# ─────────────────────────────────────────────────────────────────────────────
env:
  PARLTRACK_TIMEOUT_MINUTES: 30   # <── modifier ici si besoin (ne requiert pas de rewrite du YAML)
  # stdout est bufferisé par blocs (pas par ligne) par CPython dès qu'il détecte
  # une sortie non-TTY (cas de tout step GitHub Actions) ; stderr ne l'est jamais.
  # Sans ceci, les print() de progression apparaissent en rafale différée dans les
  # logs CI (ordre chronologique trompeur) et sont perdus si le job est tué avant
  # la fin normale du process (#259).
  PYTHONUNBUFFERED: "1"

jobs:

  # ──────────────────────────────────────────────────────────────────────────
  # JOB PRÉPARATOIRE — Calcul du matrix extract-an, un shard par candidat
  # (#344 — voir docs/technical_decisions.md#matrix-extract-an-par-candidat)
  #
  # Un shard par candidat à *slug résolvable* uniquement : un candidat sans
  # slug (raw_data/candidats.json) est un no-op silencieux dans extract-an
  # --source an (aucune chambre FR interrogeable, et --source an ne déclenche
  # jamais la recherche UE — voir process_candidat/_fetch_ue dans
  # generate_all_profiles.py), donc exclu du matrix plutôt que de générer un
  # shard qui n'écrirait jamais de fichier.
  # ──────────────────────────────────────────────────────────────────────────
  prepare-an-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      slugs: ${{ steps.slugs.outputs.slugs }}

    steps:
      - uses: actions/checkout@v5

      - name: Slugs résolvables (raw_data/candidats.json)
        id: slugs
        run: |
          SLUGS_JSON=$(python3 - <<'EOF'
          import json
          data = json.load(open("raw_data/candidats.json", encoding="utf-8"))
          slugs = [c["slug"] for c in data["candidats"] if c.get("slug")]
          print(json.dumps(slugs))
          EOF
          )
          echo "slugs=$SLUGS_JSON" >> "$GITHUB_OUTPUT"

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 1/4 — Extraction Assemblée nationale (matrix par candidat, #344)
  # ──────────────────────────────────────────────────────────────────────────
  extract-an:
    needs: [extract-amendements-an, prepare-an-matrix]
    name: extract-an (${{ matrix.slug }})
    runs-on: ubuntu-latest
    # 5 min (pas 20) : tous les shards observés en pratique se terminent en
    # 1m18s-2m10s, succès comme échec par shutdown signal (voir
    # docs/technical_decisions.md#resilience-generate-data-shutdown-signal
    # Décision 8) — sauf un cas anormal resté bloqué 20+ min sans signature
    # reconnue (run du 16/08, jerome-guedj) qui a immobilisé tout le matrix
    # séquentiel (max-parallel: 1) derrière lui. 5 min laisse une marge large
    # (>2x le pire cas normal) tout en bornant les dégâts d'un futur blocage
    # du même type à 5 min au lieu de 20+.
    timeout-minutes: 5
    strategy:
      # fail-fast: false — un shard en échec/gelé (shutdown signal) ne doit
      # jamais annuler les shards restants : sinon le matrix n'apporte aucune
      # isolation, contrairement à l'objectif de #344.
      fail-fast: false
      # max-parallel: 1 — voir le commentaire de budget mur en tête de ce
      # fichier : préserve le pic de 4 jobs simultanés déjà acté par #222.
      max-parallel: 1
      matrix:
        slug: ${{ fromJson(needs.prepare-an-matrix.outputs.slugs) }}
    # continue-on-error: true — même pattern que extract-parltrack/
    # extract-amendements-an : l'échec d'un shard ne doit pas empêcher
    # merge-and-pivot de fusionner les autres shards/sources qui ont réussi
    # (avant #222, needs: sur ce job dans extract-roster-groupes/
    # merge-and-pivot bloquait tout le run dès qu'une seule des 3 sources
    # FR/UE échouait, même si les 2 autres avaient réussi).
    continue-on-error: true

    steps:
      - uses: actions/checkout@v5

      - name: Horodatage de démarrage (diagnostic annulation/échec)
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      # Mémoire disponible sur le runner au démarrage (diagnostic OOM, voir
      # docs/technical_decisions.md#oom-lecture-amendements-par-candidat) :
      # un runner ubuntu-latest standard n'a que ~7 Gio de RAM, le même ordre
      # de grandeur que la législature amendements 16 une fois désérialisée
      # (mesuré ~4,35 Gio en local) — un OOM côté runner hébergé n'apparaît
      # jamais comme tel dans les logs GitHub Actions (pas de journalctl -k
      # accessible), seulement comme un `shutdown signal` générique. Ce
      # print ne capture que l'état de départ (rien ne s'exécute après un
      # OOM qui tue le runner lui-même, angle mort déjà documenté en #228) —
      # sert surtout à confirmer/infirmer la RAM totale réellement
      # disponible sur ce runner.
      - name: Diagnostic mémoire runner (OOM)
        run: free -h

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Semaine ISO courante (clé de cache AN)
        id: week
        run: echo "week=$(date +%G-W%V)" >> "$GITHUB_OUTPUT"

      # fresh_run=true  → pas de restore (on repart de zéro).
      # fresh_run=false → restore du cache AN ; réduit les requêtes NosDéputés.
      # Clé partagée entre tous les shards (comme avant #344, et avec
      # extract-roster-groupes) : la course déjà documentée en #248
      # sous-issue 4 n'est pas aggravée (chaque shard restaure la même clé
      # séquentiellement, max-parallel: 1, donc pas de nouvelle concurrence
      # d'écriture introduite par le matrix lui-même).
      - uses: actions/cache@v5
        if: ${{ !inputs.fresh_run }}
        with:
          path: .cache
          key: public-data-cache-an-${{ steps.week.outputs.week }}
          restore-keys: |
            public-data-cache-an-

      # fresh_run=true → purge des profils bruts et du cache avant extraction.
      - name: Nettoyage complet (fresh_run uniquement)
        if: ${{ inputs.fresh_run }}
        run: |
          rm -rf .cache
          find raw_data/profiles -name "*.json" -delete

      # Cache-only : cet artifact provient du job extract-amendements-an (#251).
      # continue-on-error: true — pas de needs: sur extract-amendements-an (voir
      # sa justification dans ce job) : en cas d'échec/absence de l'artifact,
      # ce job s'appuie sur ce que la restauration du cache partagé
      # public-data-cache-an-* contient déjà (#252). Placé après le nettoyage
      # fresh_run (pas avant) : la lecture cache-only s'applique aussi en mode
      # fresh_run, donc ne doit pas être effacée par le `rm -rf .cache` ci-dessus.
      - name: Download artifact amendements AN (optionnel)
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: amendements-index-an
          path: .cache/amendements_an

      # --source an → NosDéputés uniquement (pas de Sénat, pas d'UE dans ce job).
      # --only : un seul candidat par shard, donc --workers n'a plus d'effet
      # (le parallélisme inter-candidats est désormais porté par le matrix).
      # fresh_run=true  → --no-merge : écrasement complet.
      # fresh_run=false → fusion additive : données existantes préservées.
      # /usr/bin/time -v : trace le pic de RSS (diagnostic OOM, voir le step
      # "Diagnostic mémoire runner" ci-dessus) — n'apparaît dans les logs que
      # si le process Python se termine (normalement ou tué) sans que le
      # runner entier ne disparaisse avec lui.
      - name: Extraction AN (NosDéputés) — ${{ matrix.slug }}
        env:
          FRESH: ${{ inputs.fresh_run }}
        run: |
          MERGE_FLAG=()
          [[ "$FRESH" == "true" ]] && MERGE_FLAG=(--no-merge)
          INTERV_FLAG=()
          [[ "${{ inputs.extract_interventions }}" != "true" ]] && INTERV_FLAG=(--skip-interventions)
          MAX_PAGES_FLAG=()
          [[ "${{ inputs.extract_interventions }}" == "true" ]] && MAX_PAGES_FLAG=(--max-pages ${{ inputs.max_pages }})
          /usr/bin/time -v python3 src/generate_all_profiles.py --source an --only "${{ matrix.slug }}" "${MAX_PAGES_FLAG[@]}" "${MERGE_FLAG[@]}" "${INTERV_FLAG[@]}"

      # path scopé au seul fichier de ce candidat (pas tout raw_data/profiles/) :
      # les autres jobs d'extraction (Sénat/UE/roster) uploadent déjà la
      # totalité du dossier (baseline committée + leur propre mise à jour),
      # donc merge-and-pivot reçoit toujours la baseline complète via eux —
      # inutile de la dupliquer dans chacun des N shards AN (#344).
      - name: Upload artifact AN — ${{ matrix.slug }}
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: raw-profiles-an-${{ matrix.slug }}
          path: raw_data/profiles/${{ matrix.slug }}.json
          if-no-files-found: warn

      - name: Diagnostic — job annulé (signal externe)
        if: cancelled()
        run: |
          ELAPSED_MIN=$(( ($(date +%s) - ${JOB_START_EPOCH:-$(date +%s)}) / 60 ))
          {
            echo "### ⚠️ Job annulé — signal d'annulation externe (${{ matrix.slug }})"
            echo ""
            echo "Ce shard (candidat \`${{ matrix.slug }}\`) a été annulé de façon"
            echo "externe (signal \`cancelled()\` reçu, pas un timeout ni une erreur"
            echo "applicative) après ~${ELAPSED_MIN} min. Grâce au matrix (#344), les"
            echo "autres shards/candidats ne sont pas affectés."
            echo ""
            echo "Piste de diagnostic : vérifier les quotas/limites GitHub Actions du"
            echo "compte plutôt que les logs applicatifs de ce job (cf. #221)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnostic — job en échec
        if: failure()
        run: |
          {
            echo "### ❌ Job en échec (${{ matrix.slug }})"
            echo ""
            echo "Voir la checklist de diagnostic dans #217 (ou la section"
            echo "correspondante de \`docs/technical_decisions.md\` si archivée"
            echo "depuis)."
          } >> "$GITHUB_STEP_SUMMARY"


  # ──────────────────────────────────────────────────────────────────────────
  # JOB 2/4 — Extraction Sénat
  # ──────────────────────────────────────────────────────────────────────────
  extract-senat:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # continue-on-error: true — voir justification sur extract-an ci-dessus.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v5

      - name: Horodatage de démarrage (diagnostic annulation/échec)
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Semaine ISO courante (clé de cache Sénat)
        id: week
        run: echo "week=$(date +%G-W%V)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        if: ${{ !inputs.fresh_run }}
        with:
          path: .cache
          key: public-data-cache-senat-${{ steps.week.outputs.week }}
          restore-keys: |
            public-data-cache-senat-

      - name: Nettoyage complet (fresh_run uniquement)
        if: ${{ inputs.fresh_run }}
        run: |
          rm -rf .cache
          find raw_data/profiles -name "*.json" -delete

      # --source senat → NosSénateurs uniquement (pas d'AN, pas d'UE dans ce job).
      - name: Extraction Sénat (NosSénateurs)
        env:
          FRESH: ${{ inputs.fresh_run }}
        run: |
          MERGE_FLAG=()
          [[ "$FRESH" == "true" ]] && MERGE_FLAG=(--no-merge)
          python3 src/generate_all_profiles.py --source senat --workers ${{ inputs.workers }} "${MERGE_FLAG[@]}"

      - name: Upload artifact Sénat
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: raw-profiles-senat
          path: raw_data/profiles/
          if-no-files-found: warn

      - name: Diagnostic — job annulé (signal externe)
        if: cancelled()
        run: |
          ELAPSED_MIN=$(( ($(date +%s) - ${JOB_START_EPOCH:-$(date +%s)}) / 60 ))
          {
            echo "### ⚠️ Job annulé — signal d'annulation externe"
            echo ""
            echo "Ce job a été annulé de façon externe (signal \`cancelled()\` reçu,"
            echo "pas un timeout ni une erreur applicative) après ~${ELAPSED_MIN} min."
            echo ""
            echo "Piste de diagnostic : vérifier les quotas/limites GitHub Actions du"
            echo "compte plutôt que les logs applicatifs de ce job (cf. #221)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnostic — job en échec
        if: failure()
        run: |
          {
            echo "### ❌ Job en échec"
            echo ""
            echo "Voir la checklist de diagnostic dans #217 (ou la section"
            echo "correspondante de \`docs/technical_decisions.md\` si archivée"
            echo "depuis)."
          } >> "$GITHUB_STEP_SUMMARY"


  # ──────────────────────────────────────────────────────────────────────────
  # JOB 3/4 — Extraction API officielle Parlement européen
  # ──────────────────────────────────────────────────────────────────────────
  extract-ue-officiel:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # continue-on-error: true — voir justification sur extract-an ci-dessus.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v5

      - name: Horodatage de démarrage (diagnostic annulation/échec)
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Semaine ISO courante (clé de cache UE)
        id: week
        run: echo "week=$(date +%G-W%V)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        if: ${{ !inputs.fresh_run }}
        with:
          path: .cache
          key: public-data-cache-ue-${{ steps.week.outputs.week }}
          restore-keys: |
            public-data-cache-ue-

      - name: Nettoyage complet (fresh_run uniquement)
        if: ${{ inputs.fresh_run }}
        run: |
          rm -rf .cache
          find raw_data/profiles -name "*.json" -delete

      # --source ue → Open Data Portal Parlement européen uniquement (pas de FR).
      - name: Extraction UE (Open Data Portal EP)
        env:
          FRESH: ${{ inputs.fresh_run }}
        run: |
          MERGE_FLAG=()
          [[ "$FRESH" == "true" ]] && MERGE_FLAG=(--no-merge)
          python3 src/generate_all_profiles.py --source ue --workers ${{ inputs.workers }} "${MERGE_FLAG[@]}"

      - name: Upload artifact UE
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: raw-profiles-ue-officiel
          path: raw_data/profiles/
          if-no-files-found: warn

      - name: Diagnostic — job annulé (signal externe)
        if: cancelled()
        run: |
          ELAPSED_MIN=$(( ($(date +%s) - ${JOB_START_EPOCH:-$(date +%s)}) / 60 ))
          {
            echo "### ⚠️ Job annulé — signal d'annulation externe"
            echo ""
            echo "Ce job a été annulé de façon externe (signal \`cancelled()\` reçu,"
            echo "pas un timeout ni une erreur applicative) après ~${ELAPSED_MIN} min."
            echo ""
            echo "Piste de diagnostic : vérifier les quotas/limites GitHub Actions du"
            echo "compte plutôt que les logs applicatifs de ce job (cf. #221)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnostic — job en échec
        if: failure()
        run: |
          {
            echo "### ❌ Job en échec"
            echo ""
            echo "Voir la checklist de diagnostic dans #217 (ou la section"
            echo "correspondante de \`docs/technical_decisions.md\` si archivée"
            echo "depuis)."
          } >> "$GITHUB_STEP_SUMMARY"

  # ──────────────────────────────────────────────────────────────────────────
  # JOB 4/4 — Extraction ParlTrack (fragile — tierce source non officielle)
  #
  # continue-on-error: true → son échec ou timeout ne bloque pas merge-and-pivot.
  # Timeout court (env.PARLTRACK_TIMEOUT_MINUTES, défaut 30 min).
  # En cas d'absence d'artifact, merge-and-pivot tourne en fallback
  # (données ParlTrack du dépôt précédent, warning ajouté dans meta.warnings).
  # ──────────────────────────────────────────────────────────────────────────
  extract-parltrack:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # ← même valeur que env.PARLTRACK_TIMEOUT_MINUTES (Github Actions n'accepte pas les env vars ici)
    continue-on-error: true

    steps:
      - uses: actions/checkout@v5

      - name: Horodatage de démarrage (diagnostic annulation/échec)
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Semaine ISO courante (clé de cache ParlTrack)
        id: week
        run: echo "week=$(date +%G-W%V)" >> "$GITHUB_OUTPUT"

      # fresh_run=true  → pas de restore ; les dumps seront re-téléchargés.
      # fresh_run=false → restore du cache ParlTrack (évite re-téléchargement de centaines de Mo).
      - uses: actions/cache@v5
        if: ${{ !inputs.fresh_run }}
        with:
          path: .cache/parltrack
          key: public-data-cache-parltrack-${{ steps.week.outputs.week }}
          restore-keys: |
            public-data-cache-parltrack-

      - name: Nettoyage cache ParlTrack (fresh_run uniquement)
        if: ${{ inputs.fresh_run }}
        run: rm -rf .cache/parltrack

      # Télécharge les dumps ParlTrack (.zst) dans .cache/parltrack/.
      # Ces dumps seront uploadés comme artifact et utilisés par merge-and-pivot
      # pour l'enrichissement ParlTrack (enrich_pivot_with_parltrack).
      - name: Téléchargement dumps ParlTrack
        run: |
          python3 - <<'EOF'
          import sys
          sys.path.insert(0, "src")
          from parltrack_dumps import ensure_dump, _DUMP_DOSSIERS, _DUMP_PLENARY_AMENDMENTS, _DUMP_COMMITTEE_AMENDMENTS
          force = "${{ inputs.fresh_run }}" == "true"
          ok = True
          for dump in [_DUMP_DOSSIERS, _DUMP_PLENARY_AMENDMENTS, _DUMP_COMMITTEE_AMENDMENTS]:
              path = ensure_dump(dump, force_download=force)
              if path is None:
                  print(f"[!] Échec téléchargement : {dump}", file=sys.stderr)
                  ok = False
          sys.exit(0 if ok else 1)
          EOF

      - name: Upload artifact ParlTrack (dumps .zst)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: raw-profiles-parltrack
          path: .cache/parltrack/
          if-no-files-found: warn

      - name: Diagnostic — job annulé (signal externe)
        if: cancelled()
        run: |
          ELAPSED_MIN=$(( ($(date +%s) - ${JOB_START_EPOCH:-$(date +%s)}) / 60 ))
          {
            echo "### ⚠️ Job annulé — signal d'annulation externe"
            echo ""
            echo "Ce job a été annulé de façon externe (signal \`cancelled()\` reçu,"
            echo "pas un timeout ni une erreur applicative) après ~${ELAPSED_MIN} min."
            echo ""
            echo "Piste de diagnostic : vérifier les quotas/limites GitHub Actions du"
            echo "compte plutôt que les logs applicatifs de ce job (cf. #221)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnostic — job en échec
        if: failure()
        run: |
          {
            echo "### ❌ Job en échec"
            echo ""
            echo "Voir la checklist de diagnostic dans #217 (ou la section"
            echo "correspondante de \`docs/technical_decisions.md\` si archivée"
            echo "depuis)."
          } >> "$GITHUB_STEP_SUMMARY"

  # ──────────────────────────────────────────────────────────────────────────
  # JOB SUPPLÉMENTAIRE — Construction dédiée des index amendements AN (#251,
  # sous-issue 3/6 du plan d'architecture #248)
  #
  # Construit sans condition les 3 index de législature (17/16/15,
  # AN_AMENDEMENTS_PATH dans src/candidate_profile.py) via
  # _download_and_build_amendement_index (#250, src/build_amendements_index.py),
  # indépendamment de toute liste de candidats — à la différence de
  # extract-an/extract-roster-groupes, qui ne déclenchent cette construction
  # que paresseusement, au niveau candidat. Objectif : pré-chauffer le cache
  # partagé .cache/amendements_an/ une seule fois par run.
  #
  # Pas de needs: — tourne en parallèle des autres jobs d'extraction, y
  # compris extract-an/extract-roster-groupes qui restent, pour l'instant,
  # susceptibles de déclencher leur propre téléchargement paresseux des mêmes
  # archives si un candidat les sollicite avant la sauvegarde du cache de ce
  # job (course possible sur la clé de cache partagée ci-dessous). Accepté
  # explicitement par l'issue #251 : la bascule des jobs consommateurs vers
  # une lecture cache-only de ce cache pré-chaud (ce qui éliminerait cette
  # course) est hors périmètre ici, réservée à la sous-issue 4 de #248.
  #
  # Clé de cache réutilisée : la même clé hebdomadaire partagée
  # public-data-cache-an-* que extract-an/extract-roster-groupes, pas de clé
  # quotidienne dédiée aux amendements — décision et justification complète
  # dans docs/technical_decisions.md#amendements-index-budget-ci-cache-granularite
  # (sous-issue 1 de #248).
  #
  # continue-on-error: true, même pattern que extract-parltrack : un échec
  # (total ou partiel, une seule législature) ne bloque pas merge-and-pivot.
  # Isolation par législature préservée (#241/#242) : un échec sur l'une
  # n'empêche jamais la construction des autres (voir
  # src/build_amendements_index.py et son test dédié).
  #
  # Timeout 30 min : budget mesuré par le spike sans code de la sous-issue 1
  # de #248 (voir docs/technical_decisions.md#amendements-index-budget-ci-cache-granularite)
  # — valeur provisoire, à recalibrer sur le premier run réel
  # (workflow_dispatch), aucune mesure de débit GitHub Actions authentique
  # n'ayant pu être obtenue lors du spike.
  # ──────────────────────────────────────────────────────────────────────────
  extract-amendements-an:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true

    steps:
      - uses: actions/checkout@v5

      - name: Horodatage de démarrage (diagnostic annulation/échec)
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Semaine ISO courante (clé de cache AN, partagée avec extract-an)
        id: week
        run: echo "week=$(date +%G-W%V)" >> "$GITHUB_OUTPUT"

      # Clé de cache partagée avec extract-an/extract-roster-groupes
      # (public-data-cache-an-*) — voir
      # docs/technical_decisions.md#amendements-index-budget-ci-cache-granularite.
      # fresh_run=true → pas de restore : le job repart de zéro et retélécharge
      # les 3 archives, sans étape de purge dédiée (ce job n'écrit que sous
      # .cache/amendements_an/, absent par construction sur un checkout neuf
      # quand aucun cache n'est restauré).
      - uses: actions/cache@v5
        if: ${{ !inputs.fresh_run }}
        with:
          path: .cache
          key: public-data-cache-an-${{ steps.week.outputs.week }}
          restore-keys: |
            public-data-cache-an-

      - name: Construction des index amendements (législatures 17/16/15)
        run: python3 src/build_amendements_index.py

      - name: Upload artifact amendements AN
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: amendements-index-an
          path: .cache/amendements_an/
          if-no-files-found: warn

      - name: Diagnostic — job annulé (signal externe)
        if: cancelled()
        run: |
          ELAPSED_MIN=$(( ($(date +%s) - ${JOB_START_EPOCH:-$(date +%s)}) / 60 ))
          {
            echo "### ⚠️ Job annulé — signal d'annulation externe"
            echo ""
            echo "Ce job a été annulé de façon externe (signal \`cancelled()\` reçu,"
            echo "pas un timeout ni une erreur applicative) après ~${ELAPSED_MIN} min."
            echo ""
            echo "Piste de diagnostic : vérifier les quotas/limites GitHub Actions du"
            echo "compte plutôt que les logs applicatifs de ce job (cf. #221)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnostic — job en échec
        if: failure()
        run: |
          {
            echo "### ❌ Job en échec"
            echo ""
            echo "Voir la checklist de diagnostic dans #217 (ou la section"
            echo "correspondante de \`docs/technical_decisions.md\` si archivée"
            echo "depuis)."
          } >> "$GITHUB_STEP_SUMMARY"

  # ──────────────────────────────────────────────────────────────────────────
  # JOB SUPPLÉMENTAIRE — Extraction roster-driven (rollout progressif, #192)
  #
  # Déploiement progressif de l'extraction pilotée par la composition réelle
  # des groupes parlementaires (#188/#190), en alternative à la liste
  # éditoriale raw_data/candidats.json (~8 personnes) : le roster couvre
  # ~750+ membres. `roster_extraction_limit` (défaut 20) borne le volume
  # traité par run pour rester dans un budget CI raisonnable pendant le
  # rollout — PAS de run complet dans cette sous-issue (voir #192, hors
  # périmètre : l'activation d'un run complet planifié est une décision
  # ultérieure distincte, schedule: cron toujours commenté ci-dessus).
  #
  # Séquencé après les 4 jobs d'extraction existants (needs: ci-dessous, #222)
  # : réduit le pic de jobs Actions simultanés de 5 à 4 — mitigation du
  # plafond de dépense Actions suspecté en cause du run #24 (cf. #221), au
  # prix d'un temps mur total plus long. Requis conjointement à la clé de
  # cache AN partagée (step "Semaine ISO courante" ci-dessous) : ce
  # séquencement garantit que ce cache est déjà chaud (écrit par extract-an)
  # au moment de sa restauration ici, évitant que les deux jobs se disputent
  # le même téléchargement des dumps AN Open Data en concurrence.
  #
  # continue-on-error: true, comme extract-parltrack : un échec ou
  # dépassement de ce job ne bloque pas merge-and-pivot.
  #
  # TIMEOUT MESURÉ (#376, re-mesuré après #392) — n'est plus « provisoire ».
  #
  # Mesure en extraction légère (--skip-interventions --skip-dossiers-legislatifs,
  # --workers 1, comme ce job), échantillons aléatoires du roster :
  #   avant #392 : N=8 -> 137,9 s ; N=16 -> 231,7 s  => 44 s + 11,7 s x N
  #   après  #392 : N=8 ->  42,7 s ; N=16 ->  83,1 s  => 2,3 s + 5,05 s x N
  # Le shardage de l'index amendements par acteur (#392) a divisé le coût
  # marginal par 2,3.
  #
  # Ce que couvre 60 min : (3600 - 2,3) / 5,05 ≈ **712 membres**, sur un
  # roster de 752. Coût de la valeur par défaut (roster_extraction_limit=20) :
  # ~1,7 min — marge très large, aucune raison de toucher au timeout pour
  # l'usage actuel.
  #
  # PASSAGE À PLEINE ÉCHELLE : 752 membres coûtent ≈ 63 min, soit **juste
  # au-dessus** de ce timeout. Ce n'est donc plus un facteur 2,5 comme avant
  # #392, mais ça ne tient toujours pas d'un seul tenant. Deux conséquences,
  # tranchées dans #347 :
  #   - un run complet exige soit un timeout > 63 min, soit un découpage ;
  #   - une préemption runner fait perdre TOUT le job (l'upload d'artifact en
  #     if: always() ne s'exécute pas, angle mort #228 ; le checkpoint
  #     --resume est gitignoré donc inutile entre runs) — à 63 min la perte
  #     devient coûteuse, là où elle était indolore à 1,7 min.
  # Le découpage en shards (8 shards ≈ 94 membres ≈ 8 min chacun) traite les
  # deux à la fois. Voir docs/technical_decisions.md#budget-roster-mesure.
  # ──────────────────────────────────────────────────────────────────────────
  # ──────────────────────────────────────────────────────────────────────────
  # JOB PRÉPARATOIRE — Calcul du matrix de shards roster (#394)
  #
  # Le nombre de shards dépend de roster_extraction_limit :
  #   - limite > 0 (rollout progressif, cas par défaut) : UN seul shard. Le
  #     coût est alors faible (~1,7 min à 20) et découper n'apporterait rien,
  #     tout en changeant le sens de la limite (elle s'applique par appel de
  #     generate_all_profiles.py, donc N shards multiplieraient le volume).
  #   - limite = 0 (run complet, ~752 membres, ~63 min) : ROSTER_SHARDS
  #     tranches. C'est le seul cas où le découpage est nécessaire — un run
  #     d'un seul tenant dépasserait le timeout, et une préemption ferait
  #     perdre l'intégralité du job (l'upload en if: always() ne s'exécute pas
  #     sur shutdown signal, angle mort #228, et le checkpoint --resume est
  #     gitignoré donc inutile entre runs).
  #
  # Ce job ne lit pas raw_data/roster_candidats.json : celui-ci est régénéré
  # dans chaque shard (2 appels réseau, mutualisés par (chambre, législature)).
  # Le partitionnement se fait par position modulo côté Python (--shard I/N,
  # voir _select_shard), ce qui ne demande pas de connaître l'effectif ici.
  # ──────────────────────────────────────────────────────────────────────────
  prepare-roster-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
      shard_total: ${{ steps.shards.outputs.shard_total }}

    steps:
      - name: Liste des shards roster
        id: shards
        env:
          ROSTER_LIMIT: ${{ inputs.roster_extraction_limit }}
          # Nombre de tranches pour un run complet. 8 -> ~94 membres/shard,
          # ~8 min chacun (mesuré : 2,3 s + 5,05 s x N). Modifier ici suffit :
          # le total est propagé au flag --shard, jamais codé en dur ailleurs.
          ROSTER_SHARDS: "8"
        run: |
          set -euo pipefail
          if [[ -z "${ROSTER_LIMIT}" || "${ROSTER_LIMIT}" == "0" ]]; then
            TOTAL="${ROSTER_SHARDS}"
            echo "Run complet (limite ${ROSTER_LIMIT:-0}) : ${TOTAL} shards."
          else
            TOTAL=1
            echo "Rollout progressif (limite ${ROSTER_LIMIT}) : 1 seul shard."
          fi
          SHARDS=$(TOTAL="$TOTAL" python3 -c "import json,os; print(json.dumps(list(range(int(os.environ['TOTAL'])))))")
          echo "shards=${SHARDS}" >> "$GITHUB_OUTPUT"
          echo "shard_total=${TOTAL}" >> "$GITHUB_OUTPUT"

  extract-roster-groupes:
    needs: [extract-amendements-an, extract-an, extract-senat, extract-ue-officiel, extract-parltrack, prepare-roster-matrix]
    name: extract-roster-groupes (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    # 60 min PAR SHARD. Mesuré (#376/#392) : 2,3 s + 5,05 s x N membres.
    #   - 1 shard, limite 20  -> ~1,7 min
    #   - 8 shards, run complet -> ~94 membres/shard -> ~8 min
    # La marge reste donc très large dans les deux configurations.
    timeout-minutes: 60
    strategy:
      # fail-fast: false — un shard préempté ne doit jamais annuler les
      # autres, sinon le découpage n'apporte aucune isolation (même
      # raisonnement que #344 pour extract-an).
      fail-fast: false
      # max-parallel: 1 — préserve le pic de 4 jobs simultanés acté par #222
      # ([[concurrence-ci-roster]]). Le temps mur total reste donc ~63 min
      # pour un run complet ; ce qui change est la perte maximale sur
      # préemption, qui passe de 63 min à ~8 min.
      max-parallel: 1
      matrix:
        shard: ${{ fromJson(needs.prepare-roster-matrix.outputs.shards) }}
    continue-on-error: true

    steps:
      - uses: actions/checkout@v5

      - name: Horodatage de démarrage (diagnostic annulation/échec)
        run: echo "JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      # Voir le commentaire équivalent sur extract-an — ce job n'est pas
      # shardé par candidat (contrairement à extract-an, #344) et traite
      # plusieurs membres roster dans le même process : exposition plus
      # importante au même risque OOM (voir
      # docs/technical_decisions.md#oom-lecture-amendements-par-candidat).
      - name: Diagnostic mémoire runner (OOM)
        run: free -h

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Semaine ISO courante (clé de cache AN, partagée avec extract-an)
        id: week
        run: echo "week=$(date +%G-W%V)" >> "$GITHUB_OUTPUT"

      # Clé de cache partagée avec extract-an (public-data-cache-an-*), pas
      # une clé "roster" séparée : ce job consomme le même jeu de données
      # source (AN Open Data — SCRUTINS/AMENDEMENTS/DOSSIERS/ACTEURS/
      # ACTEURS_HISTORIQUE/QUESTIONS_CACHE_DIR, cf. src/candidate_profile.py)
      # que extract-an dès qu'un membre de roster appartient à la chambre
      # "deputes", indépendamment de la liste de candidats/membres traitée.
      # Le séquencement (needs: ci-dessus, #222) garantit que ce cache est
      # déjà chaud au moment de cette restauration.
      - uses: actions/cache@v5
        if: ${{ !inputs.fresh_run }}
        with:
          path: .cache
          key: public-data-cache-an-${{ steps.week.outputs.week }}
          restore-keys: |
            public-data-cache-an-

      - name: Nettoyage complet (fresh_run uniquement)
        if: ${{ inputs.fresh_run }}
        run: |
          rm -rf .cache
          find raw_data/profiles -name "*.json" -delete

      # Cache-only : cet artifact provient du job extract-amendements-an (#251).
      # continue-on-error: true — pas de needs: sur extract-amendements-an (voir
      # sa justification dans ce job) : en cas d'échec/absence de l'artifact,
      # ce job s'appuie sur ce que la restauration du cache partagé
      # public-data-cache-an-* contient déjà (#252). Placé après le nettoyage
      # fresh_run (pas avant) : la lecture cache-only s'applique aussi en mode
      # fresh_run, donc ne doit pas être effacée par le `rm -rf .cache` ci-dessus.
      - name: Download artifact amendements AN (optionnel)
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: amendements-index-an
          path: .cache/amendements_an

      # 2 appels réseau au total, mutualisés par (chambre, législature) — voir
      # group_roster.py / generate_roster_candidats.py. raw_data/roster_candidats.json
      # n'est pas committé : régénéré à chaque run (source de vérité = groupes_reels.json).
      - name: Construction de la liste roster-driven
        run: python3 src/generate_roster_candidats.py

      # Même fan-out par membre que extract-an/extract-senat (coût par candidat
      # identique, seul le volume change) — roster_extraction_limit borne ce
      # volume pendant le rollout progressif.
      #
      # Mode d'extraction léger (#357, sous-issue 6/6 de #351) : --skip-interventions
      # --skip-dossiers-legislatifs sont *toujours* appliqués ici, indépendamment de
      # inputs.extract_interventions (qui ne pilote que extract-an) — un membre
      # roster n'a besoin que d'identité/mandats/votes/amendements pour les agrégats
      # de groupe (#349) ; dossiers_legislatifs/interventions/questions_officielles
      # ne sont consommés par aucun agrégat actuel ni prévu, les extraire ici serait
      # du travail réseau pour rien (~750+ membres à terme, cf. rollout #192).
      - name: Extraction roster-driven (mode léger)
        env:
          FRESH: ${{ inputs.fresh_run }}
          ROSTER_LIMIT: ${{ inputs.roster_extraction_limit }}
        run: |
          MERGE_FLAG=()
          [[ "$FRESH" == "true" ]] && MERGE_FLAG=(--no-merge)
          LIMIT_FLAG=()
          [[ -n "$ROSTER_LIMIT" && "$ROSTER_LIMIT" != "0" ]] && LIMIT_FLAG=(--limit "$ROSTER_LIMIT")
          # --shard : partition déterministe par position modulo (#394). Avec
          # un seul shard (rollout progressif), 0/1 équivaut à l'absence de
          # découpage.
          /usr/bin/time -v python3 src/generate_all_profiles.py \
            --candidats raw_data/roster_candidats.json \
            --workers ${{ inputs.workers }} \
            --shard "${{ matrix.shard }}/${{ needs.prepare-roster-matrix.outputs.shard_total }}" \
            --skip-existing --resume \
            --skip-interventions --skip-dossiers-legislatifs \
            "${LIMIT_FLAG[@]}" "${MERGE_FLAG[@]}"

      # Un artifact PAR SHARD (#394) : merge-and-pivot les récupère tous via
      # pattern + merge-multiple, comme il le fait déjà pour les shards
      # extract-an (#344). Un shard préempté ne prive donc que de sa tranche.
      - name: Upload artifact roster-driven — shard ${{ matrix.shard }}
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: raw-profiles-roster-groupes-${{ matrix.shard }}
          path: raw_data/profiles/
          if-no-files-found: warn

      - name: Diagnostic — job annulé (signal externe)
        if: cancelled()
        run: |
          ELAPSED_MIN=$(( ($(date +%s) - ${JOB_START_EPOCH:-$(date +%s)}) / 60 ))
          {
            echo "### ⚠️ Job annulé — signal d'annulation externe"
            echo ""
            echo "Ce job a été annulé de façon externe (signal \`cancelled()\` reçu,"
            echo "pas un timeout ni une erreur applicative) après ~${ELAPSED_MIN} min."
            echo ""
            echo "Piste de diagnostic : vérifier les quotas/limites GitHub Actions du"
            echo "compte plutôt que les logs applicatifs de ce job (cf. #221)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnostic — job en échec
        if: failure()
        run: |
          {
            echo "### ❌ Job en échec"
            echo ""
            echo "Voir la checklist de diagnostic dans #217 (ou la section"
            echo "correspondante de \`docs/technical_decisions.md\` si archivée"
            echo "depuis)."
          } >> "$GITHUB_STEP_SUMMARY"


  # ──────────────────────────────────────────────────────────────────────────
  # JOB FUSION — merge-and-pivot
  #
  # Fusionne les artifacts des 4 jobs d'extraction, génère les pivots, les
  # profils de parti et de groupe, lance la quality gate, et committe.
  # Tourne même si un ou plusieurs des 5 jobs `needs` ci-dessous ont échoué :
  # chacun a continue-on-error: true (extract-an/extract-senat/
  # extract-ue-officiel/extract-parltrack/extract-roster-groupes), donc leur
  # échec individuel ne bloque jamais ce job — seule une annulation externe
  # (cancelled()) le ferait. La résilience aux sources partiellement en échec
  # est déléguée à la quality gate (check_quality_gate.py) plutôt qu'à needs:.
  # ──────────────────────────────────────────────────────────────────────────
  merge-and-pivot:
    needs: [extract-an, extract-senat, extract-ue-officiel, extract-parltrack, extract-roster-groupes]
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      # ── Téléchargement des artifacts d'extraction ─────────────────────────
      # Chaque source arrive dans son propre sous-répertoire pour éviter les conflits.
      # continue-on-error: true sur les 3 téléchargements ci-dessous — depuis
      # que extract-an/extract-senat/extract-ue-officiel ont eux-mêmes
      # continue-on-error: true, un échec précoce (avant l'étape "Upload
      # artifact", ex. pip install) peut laisser l'artifact absent plutôt que
      # simplement vide ; sans ce flag, download-artifact ferait échouer tout
      # ce job pour une seule source en échec. merge_raw_dirs (merge_profile.py)
      # ignore déjà silencieusement un répertoire source absent.
      # extract-an est un matrix (#344, un job par candidat à slug résolvable)
      # : pattern + merge-multiple récupère tous les artifacts raw-profiles-an-*
      # (un par shard) et les aplatit dans un seul dossier — download-artifact
      # ne fait pas échouer ce step si aucun ne matche (continue-on-error déjà
      # présent ci-dessous couvre ce cas, cohérent avec le pattern "optionnel"
      # des autres téléchargements de ce job).
      - name: Download artifacts AN — tous les shards (optionnel)
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: raw-profiles-an-*
          path: _artifacts/an
          merge-multiple: true

      - name: Download artifact Sénat (optionnel)
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: raw-profiles-senat
          path: _artifacts/senat

      - name: Download artifact UE (optionnel)
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: raw-profiles-ue-officiel
          path: _artifacts/ue

      # ParlTrack : optionnel — continue-on-error si l'artifact est absent
      # (job extract-parltrack a échoué ou timeout). Le mode fallback est
      # géré par --enrich-parltrack dans l'étape de pivot ci-dessous.
      - name: Download artifact ParlTrack (optionnel)
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: raw-profiles-parltrack
          path: .cache/parltrack

      # Roster-driven : optionnel — continue-on-error si l'artifact est absent
      # (job extract-roster-groupes a échoué/timeout, rollout progressif #192).
      # Depuis #394, extract-roster-groupes est un matrix : un artifact par
      # shard, récupérés par pattern + merge-multiple (même mécanique que les
      # shards extract-an ci-dessus). Un shard manquant (préempté) réduit la
      # couverture du run sans faire échouer la fusion.
      - name: Download artifacts roster-driven — tous les shards (optionnel)
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: raw-profiles-roster-groupes-*
          path: _artifacts/roster
          merge-multiple: true

      # ── Fusion des profils bruts des 3 sources FR/UE ──────────────────────
      # merge_profile.py --dirs : fusionne additivement les profils de chaque
      # source vers raw_data/profiles/ (même logique que --no-merge=false).
      # fresh_run=true  → on fusionne quand même les 3 artifacts (aucune donnée
      #                   repo n'est présente car les jobs extract ont purgé).
      # fresh_run=false → les artifacts contiennent déjà la fusion avec les
      #                   données repo (merge additif dans chaque job extract).
      - name: Fusion des profils bruts (AN + Sénat + UE + roster)
        run: |
          python3 src/merge_profile.py \
            --dirs _artifacts/an _artifacts/senat _artifacts/ue _artifacts/roster \
            --out raw_data/profiles

      # ── Pivot + enrichissement ParlTrack ──────────────────────────────────
      # --pivot-only   : pas d'appel réseau, normalise les profils bruts existants.
      # --enrich-parltrack : enrichit les pivots MEP si .cache/parltrack/ est
      #                      disponible ; sinon ajoute un warning fallback.
      # --parltrack-status-out : fichier JSON lu par check_quality_gate.py §5.
      # fresh_run=true  → --no-merge : recréation complète des pivots.
      # fresh_run=false → fusion additive des pivots (défaut).
      - name: Normalisation pivot + enrichissement ParlTrack
        env:
          FRESH: ${{ inputs.fresh_run }}
        run: |
          MERGE_FLAG=()
          [[ "$FRESH" == "true" ]] && MERGE_FLAG=(--no-merge)
          python3 src/generate_all_profiles.py \
            --pivot-only \
            --enrich-parltrack \
            --parltrack-status-out parltrack-status.json \
            --workers ${{ inputs.workers }} \
            "${MERGE_FLAG[@]}"

      # Pivots roster-driven (#192) : repasse --pivot-only explicitement sur
      # raw_data/roster_candidats.json (régénéré ici — fetch réseau bon marché,
      # 2 appels — plutôt que transitée par artifact) pour normaliser aussi les
      # profils bruts fusionnés depuis extract-roster-groupes. meta.provenance
      # "roster_groupe" ne rétrograde jamais un pivot "candidat_declare"
      # existant (merge_pivot_profile, voir docs/technical_decisions.md
      # #provenance-pivot) : sûr même si le même slug existe dans les deux
      # listes. No-op silencieux si extract-roster-groupes a échoué/été
      # absent (raw_data/profiles ne contient alors aucun profil roster-driven
      # → chaque candidat roster est ignoré comme "profil brut absent").
      - name: Normalisation pivot roster-driven
        env:
          FRESH: ${{ inputs.fresh_run }}
        run: |
          MERGE_FLAG=()
          [[ "$FRESH" == "true" ]] && MERGE_FLAG=(--no-merge)
          python3 src/generate_roster_candidats.py
          python3 src/generate_all_profiles.py \
            --pivot-only \
            --candidats raw_data/roster_candidats.json \
            --workers ${{ inputs.workers }} \
            "${MERGE_FLAG[@]}"

      - name: Générer les profils de parti
        run: |
          python3 src/parti_profile.py \
            --candidats raw_data/candidats.json \
            --profiles-dir pivot_data/profiles \
            --out-dir pivot_data/partis

      # fresh_run=true  → recréation complète des groupes.
      # fresh_run=false → --merge-existing : membres absents du roster live
      #                   réintégrés depuis le fichier précédent (résilience réseau).
      - name: Générer les profils de groupe parlementaire réel
        env:
          FRESH: ${{ inputs.fresh_run }}
        run: |
          MERGE_FLAG=()
          [[ "$FRESH" != "true" ]] && MERGE_FLAG=(--merge-existing)
          python3 src/generate_group_profiles.py \
            --config raw_data/groupes_reels.json \
            --profiles-dir pivot_data/profiles \
            --out-dir pivot_data/groupes \
            --validate "${MERGE_FLAG[@]}"

      # Agrégation locale depuis les profils pivot déjà produits ci-dessus,
      # pas de roster réseau (gouvernement_roster.py) : contrairement au step
      # groupes, pas de FRESH/--merge-existing équivalent — le résultat est
      # entièrement déterministe à partir des données locales à chaque run.
      # Seul appel réseau : le dump AN des dossiers législatifs
      # (gouvernement_textes.py, ~10 Mo), mutualisé une seule fois pour tous
      # les gouvernements du batch. Coût mesuré négligeable au regard du
      # budget de 60 min de ce job (#215) — pas de job dédié nécessaire, voir
      # docs/technical_decisions.md#gouvernement-ci-integration.
      - name: Générer les profils de gouvernement
        run: |
          python3 src/generate_gouvernement_profiles.py \
            --config raw_data/gouvernements_reels.json \
            --profiles-dir pivot_data/profiles \
            --out-dir pivot_data/gouvernements \
            --validate

      # Cache-only : cet artifact provient du job extract-amendements-an (#251).
      # continue-on-error: true — même pattern que l'étape homonyme d'extract-an/
      # extract-roster-groupes (#252) : en cas d'échec/absence, la section 3d du
      # quality gate signale simplement chaque législature "jamais construite"
      # au lieu de lire une fraîcheur réelle (dégradation gracieuse, pas un échec
      # de job). Alimente check_quality_gate.py --amendements-cache-dir (défaut
      # .cache/amendements_an, section 3d, issue #254).
      - name: Download artifact amendements AN (optionnel)
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: amendements-index-an
          path: .cache/amendements_an

      # inputs.threshold appliqué dans tous les modes (y compris fresh_run=true).
      # §5 ParlTrack : --parltrack-status-file active la section de rapport
      #   enrichi ce run vs fallback (nb candidats dans chaque catégorie).
      - name: Quality gate — résumé et contrôle qualité
        env:
          THRESHOLD: ${{ inputs.threshold }}
        run: |
          # inputs.threshold a un défaut déclaré de 3 ; traitement du défaut en
          # bash pour éviter que GHA évalue 0 comme falsy (0 || 3 → 3).
          GATE_THRESHOLD="${THRESHOLD:-3}"
          python3 src/check_quality_gate.py \
            --profiles-dir      pivot_data/profiles \
            --groupes-dir       pivot_data/groupes \
            --partis-dir        pivot_data/partis \
            --raw-dir           raw_data/profiles \
            --candidats         raw_data/candidats.json \
            --groupes-config    raw_data/groupes_reels.json \
            --gouvernements-dir    pivot_data/gouvernements \
            --gouvernements-config raw_data/gouvernements_reels.json \
            --threshold         "$GATE_THRESHOLD" \
            --low-interventions 10 \
            --groupe-min-members 1 \
            --parltrack-status-file parltrack-status.json
            # --groupe-min-coverage-pct XX  # To be set after running and audit of workflow (cf. #193)

      # Garde-fou #390 : ne JAMAIS committer un build produit avec du code
      # périmé.
      #
      # actions/checkout fige le SHA de main au déclenchement du run, alors que
      # ce job ne démarre qu'après les 5 jobs d'extraction (20+ min plus tard).
      # Si une PR touchant src/ est mergée dans cette fenêtre, tout ce que ce
      # job vient de dériver (pivots, partis, groupes, gouvernements) l'a été
      # avec l'ANCIEN code de génération. Committer ce résultat publierait de
      # la donnée fausse — et potentiellement en silence, si git parvient à
      # merger sans conflit. Vécu sur le run #266, où seul un conflit de rebase
      # a empêché d'écraser le correctif #379 par des groupes régénérés avec le
      # code d'avant ce correctif.
      #
      # Asymétrie qui fonde ce choix : ne rien committer coûte un run, et toute
      # la donnée dérivée est régénérable ; committer un build périmé publie
      # une erreur. Refuser de committer est donc le défaut, pas le cas
      # d'échec.
      #
      # Condition volontairement ÉTROITE (src/ seulement) : un commit de doc ou
      # de données ne doit rien déclencher — c'est le cas que la boucle de
      # retry du push sait traiter, depuis la correction de #389. La relance
      # est prise en charge par retry-generate-data.yml, qui plafonne déjà à
      # une seule tentative automatique.
      - name: Vérifier que le code de génération n'a pas changé pendant le run
        env:
          BASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          if git diff --quiet "$BASE_SHA" origin/main -- src/; then
            echo "✓ src/ inchangé sur origin/main depuis le début du run — commit sûr."
            exit 0
          fi
          echo "Fichiers de src/ modifiés sur origin/main pendant ce run :"
          git diff --name-only "$BASE_SHA" origin/main -- src/ | sed 's/^/  - /'
          {
            echo "### ⛔ Commit annulé — code de génération modifié pendant le run"
            echo ""
            echo "\`src/\` a changé sur \`origin/main\` depuis le SHA sur lequel ce job"
            echo "a été checkouté (\`$BASE_SHA\`). Les fichiers dérivés produits ici"
            echo "l'ont donc été avec du code périmé : les committer publierait de la"
            echo "donnée potentiellement fausse (voir #390)."
            echo ""
            echo "Aucune donnée n'est perdue — tout est régénérable. Un nouveau run"
            echo "sur le \`main\` à jour produira un résultat cohérent."
          } >> "$GITHUB_STEP_SUMMARY"
          # Marqueur greppable par retry-generate-data.yml, distinct de la
          # signature de préemption runner, pour que le diagnostic de la
          # relance reste lisible.
          echo "::error::GENERATION_CODE_CHANGED_DURING_RUN — src/ modifié sur origin/main pendant le run ; commit annulé pour ne pas publier un build périmé (#390)."
          exit 1

      - name: Committer et pousser les données mises à jour
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add raw_data/profiles pivot_data/profiles pivot_data/partis pivot_data/groupes pivot_data/gouvernements
          if git diff --cached --quiet; then
            echo "Aucun changement de données à committer."
            exit 0
          fi
          git commit -m "chore: mise à jour automatique des données ($(date -u +%Y-%m-%d))"

          # actions/checkout sur workflow_dispatch fige le SHA de main au moment du
          # déclenchement du run, pas au démarrage de ce job — et ce job ne démarre
          # qu'après les 5 jobs d'extraction (needs), qui peuvent prendre 20+ min
          # (extraction séquentielle, cf. #222). Tout commit humain ou automatisé
          # atterrissant sur main dans cette fenêtre fait échouer un simple `git
          # push` (non fast-forward) alors que la donnée collectée est valide —
          # vécu sur le run #29 (rejeté par un commit doc poussé pendant le run).
          # Rebase + retry au lieu d'échouer tout le job sur une donnée déjà
          # committée localement.
          #
          # `set +e` sur la portée de la boucle (#389) : ce step s'exécute avec
          # `bash -e {0}` (aucun `defaults: shell` déclaré dans ce workflow), donc
          # le premier `git rebase` en conflit terminait immédiatement le step —
          # les tentatives 2 et 3 ne s'exécutaient jamais, et le message d'erreur
          # final n'était jamais atteint. Constaté sur le run #266 : une seule
          # ligne « tentative 1/3 » dans le log, puis sortie en échec.
          set +e
          push_status=""
          for attempt in 1 2 3; do
            if git push; then
              echo "Push réussi (tentative ${attempt}/3)."
              exit 0
            fi
            echo "Push rejeté (tentative ${attempt}/3) — rebase sur origin/main et nouvel essai."
            git fetch origin main
            if ! git rebase --autostash origin/main; then
              # Un conflit de rebase ne se résoudra jamais en rebouclant : les
              # deux côtés ont réécrit les mêmes fichiers générés (cas du run
              # #266, cause traitée dans #390). On sort tout de suite, après
              # avoir rendu le dépôt propre — un rebase inachevé bloquerait
              # toute logique ajoutée ensuite.
              git rebase --abort || true
              push_status="conflit"
              break
            fi
          done
          set -e

          if [ "$push_status" = "conflit" ]; then
            echo "::error::Conflit de rebase sur les fichiers générés — un retry ne peut pas le résoudre. Les deux côtés ont régénéré les mêmes fichiers (voir #390). Intervention manuelle requise."
          else
            echo "::error::Push toujours rejeté après 3 tentatives, rebases réussis — concurrence soutenue sur main. Intervention manuelle requise."
          fi
          exit 1
