name: Génération des données

on:
  #schedule:
  #  - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      fresh_run:
        description: >
          Démarrage à froid — purge complète des sorties et du cache,
          génération sans fusion, quality gate à tolérance zéro.
          false = mode incrémental résilient (fusion additive, cache restauré, seuil souple).
        type: boolean
        default: false
      threshold:
        description: >
          Seuil IncompleteRead (soft fail). Ignoré si fresh_run=true
          (seuil forcé à 0). Défaut : 3.
        type: number
        default: 3

# Nécessaire pour que le job puisse pousser la mise à jour des données.
permissions:
  contents: write

# Évite deux exécutions qui écriraient/committeraient en même temps.
concurrency:
  group: generate-data
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 340   # bien au-delà de 59 min, limite standard des runners

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      # fresh_run=true  → purge complète (sorties + .cache) avant régénération à zéro.
      # fresh_run=false → les sorties existantes sont conservées pour la fusion additive.
      - name: Nettoyage complet des données et du cache (fresh_run uniquement)
        if: ${{ inputs.fresh_run }}
        run: |
          rm -rf .cache
          find raw_data/profiles   -name "*.json"       -delete
          find pivot_data/profiles -name "*.pivot.json" -delete
          find pivot_data/partis   -name "*.json"       -delete
          find pivot_data/groupes  -name "*.json"       -delete

      - name: Semaine ISO courante (clé de cache)
        id: week
        run: echo "week=$(date +%G-W%V)" >> "$GITHUB_OUTPUT"

      # fresh_run=true  → pas de restore (on repart de zéro, y compris pour .cache/).
      # fresh_run=false → restore autorisé ; réduit les requêtes vers les API publiques.
      # Clé renouvelée chaque semaine.
      - uses: actions/cache@v4
        if: ${{ !inputs.fresh_run }}
        with:
          path: .cache
          key: public-data-cache-${{ steps.week.outputs.week }}
          restore-keys: |
            public-data-cache-

      # fresh_run=true  → --no-merge : écrasement complet, données entièrement re-fetchées.
      # fresh_run=false → fusion additive (défaut) : les entrées existantes sont préservées,
      #                   seules les nouvelles données sont ajoutées. Résilient aux aléas réseau.
      - name: Générer les profils individuels (extraction + pivot)
        env:
          FRESH: ${{ inputs.fresh_run }}
        run: |
          MERGE_FLAG=()
          [[ "$FRESH" == "true" ]] && MERGE_FLAG=(--no-merge)
          python3 src/generate_all_profiles.py --pivot "${MERGE_FLAG[@]}"

      - name: Générer les profils de parti
        run: |
          python3 src/parti_profile.py \
            --candidats raw_data/candidats.json \
            --profiles-dir pivot_data/profiles \
            --out-dir pivot_data/partis

      # fresh_run=true  → recréation complète à chaque exécution (comportement strict,
      #                   le fichier existant est entièrement remplacé par les données du run).
      # fresh_run=false → --merge-existing : les membres du fichier précédent absents du
      #                   roster récupéré cette fois-ci (ex. échec partiel de l'API live)
      #                   sont réintégrés avec un avertissement dans meta.warnings. Évite
      #                   les trous temporaires dus aux aléas réseau.
      # Un seul fetch réseau par (chambre, législature) distincte (voir generate_group_profiles.py).
      - name: Générer les profils de groupe parlementaire réel
        env:
          FRESH: ${{ inputs.fresh_run }}
        run: |
          MERGE_FLAG=()
          [[ "$FRESH" != "true" ]] && MERGE_FLAG=(--merge-existing)
          python3 src/generate_group_profiles.py \
            --config raw_data/groupes_reels.json \
            --profiles-dir pivot_data/profiles \
            --out-dir pivot_data/groupes \
            --validate "${MERGE_FLAG[@]}"

      # fresh_run=true  → tolérance zéro (threshold=2) : 2 IncompleteRead bloque
      #                   le commit. Structure groupe cassée = échec dur dans les deux cas.
      # fresh_run=false → seuil souple (inputs.threshold, défaut 3) : les aléas réseau
      #                   transitoires ne bloquent pas le commit incrémental.
      - name: Quality gate — résumé et contrôle qualité
        env:
          FRESH: ${{ inputs.fresh_run }}
          THRESHOLD: ${{ inputs.threshold != '' && inputs.threshold || 3 }}
        run: |
          [[ "$FRESH" == "true" ]] && GATE_THRESHOLD=2 || GATE_THRESHOLD="$THRESHOLD"
          python3 src/check_quality_gate.py \
            --profiles-dir      pivot_data/profiles \
            --groupes-dir       pivot_data/groupes \
            --partis-dir        pivot_data/partis \
            --raw-dir           raw_data/profiles \
            --candidats         raw_data/candidats.json \
            --groupes-config    raw_data/groupes_reels.json \
            --threshold         "$GATE_THRESHOLD" \
            --low-interventions 10 \
            --groupe-min-members 1

      - name: Committer et pousser les données mises à jour
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add raw_data/profiles pivot_data/profiles pivot_data/partis pivot_data/groupes
          if git diff --cached --quiet; then
            echo "Aucun changement de données à committer."
          else
            git commit -m "chore: mise à jour automatique des données ($(date -u +%Y-%m-%d))"
            git push
          fi
