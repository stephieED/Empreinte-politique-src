<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Empreinte politique — En clair</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="design-tokens.css">
<style>
  :root {
    /* Palette éditoriale — justifiée par le sujet */
    --bg: #F4EFE4;          /* Parchemin — fond de page, évoque les archives */
    --surface: #FFFDF8;     /* Blanc chaud — panneaux de contenu */
    --text: #1A2332;        /* Encre — texte principal, procès-verbal */
    --muted: #7A6652;       /* Sépia — secondaire, labels, dates */
    --line: #DDD5C5;        /* Lin chaud — bordures discrètes */
    --deep: #1A2332;        /* = Encre (compatibilité interne) */
    --accent: #7A6652;      /* = Sépia (liens discrets, neutralité) */
    --accent-soft: #EDE8DC; /* Parchemin clair — état actif des filtres */
    /* Couleurs sémantiques de vote — jamais décoratives */
    --vert: #27744F;        /* Vert quorum — vote POUR / présence */
    --rouge: #C0392B;       /* Rouge scrutin — vote CONTRE / absence */
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; overflow-x: hidden; }
  body {
    font-family: 'Source Sans 3', 'Segoe UI', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.45;
  }
  button { font: inherit; }

  .page { max-width: 1040px; margin: 0 auto; padding: 1rem 0.9rem 5rem; }
  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 0.9rem;
    margin-bottom: 0.8rem;
  }

  h1, h2, h3 { margin: 0 0 0.55rem; color: var(--deep); line-height: 1.2; font-family: 'Libre Baskerville', Georgia, serif; }
  h1 { font-size: 1.35rem; }
  h2 { font-size: 1.05rem; }
  h3 { font-size: 0.98rem; }
  p { margin: 0.35rem 0; }
  .small { font-size: 0.88rem; color: var(--muted); }
  .muted { color: var(--muted); }
  .empty { color: var(--muted); font-style: italic; }
  /* Références vérifiables : signal visuel "coordonnée de source primaire" */
  .source-ref {
    font-family: 'IBM Plex Mono', 'Courier New', monospace;
    font-size: 0.8rem;
    color: var(--muted);
    letter-spacing: -0.01em;
  }
  .text-fallback-note {
    margin-top: 0.7rem;
  }
  .text-unpublished-bar {
    margin-top: var(--space-16);
    padding-top: 0.6rem;
    border-top: 1px dashed var(--line);
  }
  .text-unpublished-toggle {
    background: none;
    border: 1px dashed var(--line);
    border-radius: 6px;
    padding: 0.35rem 0.7rem;
    font-size: 0.8rem;
    font-family: 'IBM Plex Mono', 'Courier New', monospace;
    color: var(--muted);
    cursor: pointer;
  }
  .text-unpublished-toggle:hover { border-color: var(--text); color: var(--text); }
  .text-unpublished-reason { font-size: 0.72rem; opacity: 0.7; }
  .text-fallback-grid {
    display: grid;
    gap: 0.6rem;
    margin-top: 0.45rem;
  }
  .text-fallback-item {
    border: 1px dashed var(--line);
    background: var(--accent-soft);
    padding: 0.6rem;
    border-radius: 8px;
  }
  .text-fallback-title {
    font-weight: 600;
    margin-bottom: 0.25rem;
  }
  .text-fallback-reason {
    display: inline-block;
    margin-right: 0.35rem;
    margin-bottom: 0.25rem;
    font-family: 'IBM Plex Mono', 'Courier New', monospace;
    font-size: 0.72rem;
    color: var(--muted);
  }
  .legislative-context {
    border: 1px solid var(--line);
    border-left: 5px solid var(--accent);
    background: var(--bg);
    padding: 0.7rem;
    margin-bottom: 0.8rem;
  }
  .legislative-context-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 0.6rem;
    flex-wrap: wrap;
  }
  .legislative-context-status {
    font-family: 'Libre Baskerville', Georgia, serif;
    font-weight: 700;
  }
  .legislative-reading-controls {
    display: flex;
    gap: 0.35rem;
    flex-wrap: wrap;
    margin-top: 0.6rem;
  }
  .legislative-reading-controls button {
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--text);
    padding: 0.3rem 0.55rem;
    cursor: pointer;
  }
  .legislative-reading-controls button[aria-pressed="true"] {
    border-color: var(--accent);
    background: var(--accent-soft);
    font-weight: 600;
  }
  .legislative-block {
    border-top: 1px solid var(--line);
    padding-top: 0.75rem;
    margin-top: 0.8rem;
  }
  .legislative-block.is-primary {
    border-top: 4px solid var(--accent);
    background: color-mix(in srgb, var(--accent-soft) 42%, transparent);
    padding: 0.8rem;
  }
  .legislative-block-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 0.7rem;
    flex-wrap: wrap;
    margin-bottom: 0.35rem;
  }
  .legislative-block-head h2 { margin-bottom: 0; }
  .legislative-block-badges {
    display: flex;
    gap: 0.35rem;
    flex-wrap: wrap;
  }
  .legislative-badge {
    border: 1px solid var(--line);
    background: var(--surface);
    padding: 0.18rem 0.38rem;
    font-family: 'IBM Plex Mono', 'Courier New', monospace;
    font-size: 0.68rem;
  }

  .section-kicker {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 0 0 0.4rem;
  }

  /* Carrousel d'avatars — remplace le menu déroulant de sélection */
  .avatar-carousel {
    display: flex;
    gap: 0.6rem;
    overflow-x: auto;
    scroll-snap-type: x proximity;
    padding: 0.15rem 0.1rem 0.35rem;
    -webkit-overflow-scrolling: touch;
  }
  .avatar-chip {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.28rem;
    flex-shrink: 0;
    width: 64px;
    scroll-snap-align: start;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    color: var(--text);
  }
  .avatar-chip-circle {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    overflow: hidden;
    border: var(--border-width) solid var(--line);
    background: linear-gradient(145deg, var(--accent-soft), var(--line));
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.92rem;
    font-family: 'Libre Baskerville', Georgia, serif;
    color: var(--deep);
    transition: border-color 0.15s, transform 0.15s;
  }
  .avatar-chip-circle img { width: 100%; height: 100%; object-fit: cover; }
  .avatar-chip.active .avatar-chip-circle { border-color: var(--accent); transform: scale(1.06); }
  .avatar-chip:disabled { opacity: 0.4; cursor: not-allowed; }
  .avatar-chip-name {
    font-size: 0.7rem;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 64px;
  }
  .avatar-chip.active .avatar-chip-name { color: var(--deep); font-weight: 600; }

  /* Variante compacte pour la sélection de comparaison (multi-sélection) */
  .avatar-chip--mini .avatar-chip-circle { width: 40px; height: 40px; font-size: 0.76rem; }
  .avatar-chip--mini .avatar-chip-name { max-width: 52px; }

  .hero {
    display: grid;
    grid-template-columns: 62px 1fr;
    gap: 0.7rem;
    align-items: center;
  }
  .avatar {
    width: 62px;
    height: 62px;
    border-radius: 50%;
    overflow: hidden;
    border: 1px solid var(--line);
    background: linear-gradient(145deg, var(--accent-soft), var(--line));
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-family: 'Libre Baskerville', Georgia, serif;
    color: var(--deep);
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }

  .tags { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.25rem; }
  .tag {
    display: inline-flex;
    align-items: center;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--bg);
    padding: 0.13rem 0.56rem;
    font-size: 0.8rem;
    color: var(--deep);
  }

  .summary-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0.55rem;
    margin-top: 0.65rem;
  }

  /* Cartes KPI en flip 3D : recto = pictogramme + chiffre, verso = l'explication/limite */
  .kpi-flip {
    perspective: 1000px;
    cursor: pointer;
    border: none;
    background: none;
    padding: 0;
    text-align: left;
    font: inherit;
    color: inherit;
  }
  .kpi-flip-inner {
    position: relative;
    min-height: 132px;
    transition: transform 0.5s;
    transform-style: preserve-3d;
  }
  .kpi-flip.flipped .kpi-flip-inner,
  .kpi-flip:focus-visible .kpi-flip-inner { transform: rotateY(180deg); }
  @media (hover: hover) {
    .kpi-flip:hover .kpi-flip-inner { transform: rotateY(180deg); }
  }
  .kpi-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 0.6rem;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    overflow: hidden; /* prevent raw mid-word bleed when content exceeds min-height */
  }
  .kpi-face--back { transform: rotateY(180deg); overflow-y: auto; justify-content: center; }
  .kpi-icon { color: var(--accent); margin-bottom: 0.2rem; }
  .kpi-icon svg { display: block; }
  /* Valeur chiffrée en monospace : signal "donnée vérifiable, pas décorative" */
  .kpi-value {
    font-size: 1.5rem;
    font-weight: 700;
    line-height: 1;
    color: var(--deep);
    font-family: 'IBM Plex Mono', 'Courier New', monospace;
  }
  .kpi-label { font-size: 0.78rem; color: var(--muted); margin-top: auto; }
  .kpi-face--back .kpi-back-text { font-size: 0.8rem; color: var(--text); margin: 0 0 0.4rem; }
  .kpi-face--back .kpi-back-link {
    align-self: flex-start;
    font-size: 0.78rem;
    color: var(--accent);
    background: none;
    border: none;
    padding: 0;
    text-decoration: underline;
    cursor: pointer;
  }

  .trust-line {
    margin-top: 0.5rem;
    border-top: 1px dashed var(--line);
    padding-top: 0.48rem;
    font-size: 0.84rem;
    color: var(--muted);
  }

  /* Répartition thématique — histogramme horizontal */
  .theme-dist { margin-top: 0.85rem; }
  .theme-dist-title { font-size: 0.84rem; color: var(--muted); margin: 0 0 0.45rem; }
  .theme-dist-row { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.38rem; }
  .theme-dist-label { width: 110px; flex-shrink: 0; font-size: 0.82rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .theme-dist-bar-wrap { flex: 1; background: var(--line); border-radius: 3px; height: 7px; overflow: hidden; }
  .theme-dist-bar { height: 100%; background: var(--deep); border-radius: 3px; }
  .theme-dist-count { width: 36px; text-align: right; font-family: var(--font-family-mono); font-size: 0.78rem; color: var(--muted); }

  /* Profil de vote — répartition, jamais un score unique */
  .vote-profile-bar { display: flex; height: 10px; border-radius: 4px; overflow: hidden; margin-top: 0.4rem; background: var(--line); }
  .vote-profile-seg--pour { background: var(--vert); }
  .vote-profile-seg--contre { background: var(--rouge); }
  .vote-profile-seg--abstention { background: var(--muted); }
  .vote-profile-seg--absent { background: var(--line); }
  .vote-profile-legend { display: flex; flex-wrap: wrap; gap: 0.55rem; margin-top: 0.4rem; font-size: 0.78rem; color: var(--muted); }
  .vote-profile-legend .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 0.28rem; vertical-align: middle; }
  .vote-profile-legend .dot--pour { background: var(--vert); }
  .vote-profile-legend .dot--contre { background: var(--rouge); }
  .vote-profile-legend .dot--abstention { background: var(--muted); }

  /* Panneaux glissants (swipe) — remplace la navigation par ancres empilées */
  .panel-indicator {
    display: flex;
    gap: 0.5rem;
    justify-content: center;
    align-items: center;
    margin: 0.6rem 0;
  }
  .panel-dot {
    border: 1px solid var(--line);
    background: var(--surface);
    border-radius: 999px;
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--muted);
    padding: 0;
    font-size: 0.95rem;
  }
  .panel-dot svg,
  .theme-pill svg {
    width: 1rem;
    height: 1rem;
    flex: 0 0 auto;
    display: inline-block;
    vertical-align: middle;
  }
  .theme-pill {
    display: inline-flex;
    align-items: center;
    gap: 0.38rem;
  }
  .panel-dot.active { background: var(--accent-soft); border-color: var(--accent); color: var(--deep); }
  .swipe-deck {
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    border-radius: 12px;
    scrollbar-width: none;
  }
  .swipe-deck::-webkit-scrollbar { display: none; }
  .swipe-panel {
    flex: 0 0 100%;
    scroll-snap-align: start;
    min-width: 100%;
    padding-right: 0.1rem;
  }
  .swipe-hint { text-align: center; font-size: 0.74rem; color: var(--muted); margin: 0.1rem 0 0.5rem; }

  .themes-row {
    display: flex;
    gap: 0.4rem;
    overflow-x: auto;
    padding-bottom: 0.2rem;
  }
  .theme-pill {
    border: 1px solid var(--line);
    background: var(--surface);
    border-radius: 999px;
    padding: 0.22rem 0.58rem;
    font-size: 0.83rem;
    white-space: nowrap;
    cursor: pointer;
  }
  .theme-pill.active {
    background: var(--accent-soft);
    border-color: #C4B8A4;
    color: var(--deep);
    font-weight: 600;
  }

  .rows { display: grid; gap: 0.55rem; }
  .row-item {
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface);
    padding: 0.65rem;
  }
  .row-item p { margin: 0.18rem 0; }

  /* Bande de scrutin — élément signature.
     Barre verticale gauche de 4 px : la colonne de couleurs formée
     en vue liste donne un bilan visuel immédiat sans lire les libellés. */
  .vote-card { border-left-width: 4px; }
  .vote-card--pour       { border-left-color: var(--vert); }
  .vote-card--contre     { border-left-color: var(--rouge); }
  .vote-card--abstention { border-left-color: var(--muted); border-left-style: dashed; }
  .vote-card--absent     { border-left-color: var(--line); }

  /* Badges de position — couleur réservée au sens, jamais décorative */
  .vote-badge {
    display: inline-block;
    border-radius: 4px;
    padding: 0.12rem 0.45rem;
    font-size: 0.78rem;
    letter-spacing: 0.01em;
    margin-left: 0.3rem;
    border: 1px solid var(--line);
    color: var(--muted);
    background: var(--bg);
  }
  .vote-badge.pour {
    background: #EAF5EE;
    border-color: var(--vert);
    color: var(--vert);
    font-weight: 600;
  }
  .vote-badge.contre {
    background: #FAEAEA;
    border-color: var(--rouge);
    color: var(--rouge);
    font-weight: 600;
  }
  .vote-badge.abstention {
    background: var(--bg);
    border-color: var(--muted);
    border-style: dashed;
    color: var(--muted);
  }
  .vote-badge.absent {
    background: var(--bg);
    border-color: var(--line);
    color: var(--muted);
  }

  .votes-table-wrap { display: none; overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; }
  th, td {
    border-bottom: 1px solid var(--line);
    text-align: left;
    font-size: 0.84rem;
    padding: 0.5rem 0.45rem;
    vertical-align: top;
  }
  th { color: var(--deep); font-family: 'Libre Baskerville', Georgia, serif; }

  details.inline-help {
    display: inline-block;
    margin-left: 0.35rem;
    vertical-align: middle;
  }
  details.inline-help summary {
    list-style: none;
    cursor: pointer;
    border: 1px solid var(--line);
    border-radius: 999px;
    width: 18px;
    height: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.72rem;
    color: var(--deep);
    user-select: none;
  }
  details.inline-help summary::-webkit-details-marker { display: none; }
  details.inline-help p {
    margin-top: 0.45rem;
    margin-bottom: 0;
    font-size: 0.82rem;
    color: var(--muted);
    max-width: 320px;
  }

  .absence-grid {
    display: grid;
    gap: 0.5rem;
    grid-template-columns: 1fr;
  }
  .absence-box {
    border: 1px dashed var(--line);
    border-radius: 10px;
    padding: 0.58rem;
    background: var(--bg);
  }
  .absence-box ul { margin: 0.3rem 0 0; padding-left: 1rem; }

  .inter-controls {
    display: flex;
    gap: 0.45rem;
    margin-bottom: 0.45rem;
    flex-wrap: wrap;
  }
  .ghost-btn {
    border: 1px solid var(--line);
    background: var(--surface);
    border-radius: 9px;
    padding: 0.28rem 0.58rem;
    font-size: 0.84rem;
    cursor: pointer;
  }
  .ghost-btn.active-choice {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--deep);
    font-weight: 600;
  }

  .compare-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 0.52rem;
    margin-top: 0.5rem;
  }
  .compare-card {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 0.6rem;
    background: var(--surface);
  }

  a.link { color: var(--accent); text-decoration: none; }
  a.link:hover { text-decoration: underline; }

  @media (min-width: 760px) {
    .page { padding: 1.15rem 1.15rem 4rem; }
    h1 { font-size: 1.6rem; }
    .panel { padding: var(--space-16); }
    .hero { grid-template-columns: 76px 1fr; }
    .avatar { width: 76px; height: 76px; }
    .votes-cards { display: none; }
    .votes-table-wrap { display: block; }
    .absence-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .compare-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .summary-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .theme-dist-label { width: 140px; }
  }

  /* Variante B — "Le Bulletin" : cockpit civique, dense et tactile. */
  .cockpit {
    --bg: #F0F2ED;
    --surface: #FAFBF7;
    --text: #17211D;
    --deep: #17211D;
    --muted: #65716B;
    --line: #C9D0C9;
    --accent: #006B64;
    --accent-soft: #D8EBE6;
    --signal: #E8593C;
    --sun: #E6B447;
    font-family: 'Manrope', sans-serif;
    background-color: var(--bg);
    background-image: linear-gradient(rgba(23, 33, 29, 0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(23, 33, 29, 0.035) 1px, transparent 1px);
    background-size: 24px 24px;
  }
  .cockpit h1,
  .cockpit h2,
  .cockpit h3 { font-family: 'Newsreader', serif; }
  .cockpit .page { max-width: 1180px; padding-bottom: 6.5rem; }
  .cockpit .panel { border-radius: 8px; box-shadow: 0 4px 18px rgba(23, 33, 29, 0.045); }
  .cockpit .masthead {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 0.7rem;
    align-items: end;
    border-top: 5px solid var(--deep);
  }
  .cockpit .masthead h1 { font-size: clamp(1.8rem, 5vw, 3rem); margin: 0; }
  .cockpit .masthead > .section-kicker,
  .cockpit .masthead > .avatar-carousel { grid-column: 1 / -1; }
  .cockpit .edition-mark {
    font-family: var(--font-family-mono);
    font-size: 0.68rem;
    text-align: right;
    color: var(--muted);
  }

  /* Les candidats deviennent des tickets horizontaux, pas des stories. */
  .cockpit .avatar-carousel { gap: 0.5rem; padding: 0.45rem 0 0.15rem; }
  .cockpit .avatar-chip {
    width: 132px;
    min-height: 56px;
    display: grid;
    grid-template-columns: 38px 1fr;
    grid-template-rows: 1fr;
    gap: 0.5rem;
    text-align: left;
    align-items: center;
    padding: 0.45rem;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: var(--surface);
  }
  .cockpit .avatar-chip-circle {
    width: 38px;
    height: 38px;
    border: 1px solid var(--line);
    border-radius: 5px;
    font-family: var(--font-family-mono);
    font-size: 0.78rem;
  }
  .cockpit .avatar-chip-name {
    max-width: 78px;
    font-size: 0.76rem;
    color: var(--text);
  }
  .cockpit .avatar-chip.active {

  .cockpit #resume { position: relative; overflow: hidden; }

  /* KPI bento avec révélation plane; aucune rotation 3D. */
  .cockpit .summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cockpit .kpi-flip { perspective: none; }
  .cockpit .kpi-flip-inner { min-height: 142px; transform-style: flat; transition: none; }
  .cockpit .kpi-face {

  .cockpit .kpi-face--front { border-top: 4px solid var(--accent); }

  .cockpit .kpi-flip:nth-child(3) .kpi-face--front { border-top-color: var(--signal); }
  .cockpit .kpi-flip:nth-child(4) .kpi-face--front { border-top-color: var(--deep); }
  .cockpit .kpi-face--back {
    transform: translateY(8px);

    pointer-events: none;
    justify-content: center;

  .cockpit .kpi-flip.flipped .kpi-flip-inner,
  .cockpit .kpi-flip:focus-visible .kpi-flip-inner { transform: none; }
  .cockpit .kpi-flip.flipped .kpi-face--front { opacity: 0; transform: translateY(-8px); }
  .cockpit .kpi-flip.flipped .kpi-face--back { opacity: 1; transform: none; pointer-events: auto; }
  @media (hover: hover) {
    .cockpit .kpi-flip:hover .kpi-flip-inner { transform: none; }
    .cockpit .kpi-flip:hover .kpi-face--front { opacity: 0; transform: translateY(-8px); }
    .cockpit .kpi-flip:hover .kpi-face--back { opacity: 1; transform: none; pointer-events: auto; }
  }
  .cockpit .kpi-icon { color: var(--accent); }
  .cockpit .kpi-value { font-size: clamp(1.35rem, 5vw, 2.3rem); }

  /* Barre d'onglets fixe, comportement familier des apps mobiles. */
  .cockpit .panel-indicator {

  .cockpit .panel-dot small { font-size: 0.54rem; line-height: 1; }
  .cockpit .panel-dot.active { color: var(--surface); background: var(--accent); }
  .cockpit .swipe-deck { display: block; overflow: visible; border-radius: var(--radius-none); }
  .cockpit .swipe-panel { display: none; min-width: 0; padding: 0; animation: panel-in 0.26s ease both; }
  .cockpit .swipe-panel.active { display: block; }
  .cockpit .swipe-hint { display: none; }
  @keyframes panel-in {

  .cockpit .row-item,
  .cockpit .absence-box,

  @media (min-width: 760px) {

    .cockpit .panel-indicator { bottom: 1rem; }
    .cockpit .panel-dot { min-width: 76px; }
    .cockpit .panel-dot small { font-size: 0.62rem; }

  /* Variante C — CONTRECHAMP. Chaque famille de données a sa propre forme. */
  .deconstructed {

    --surface: var(--color-offwhite);
    --text: var(--color-ink);
    --deep: var(--color-ink);

  .deconstructed .brand-home {

  .deconstructed .candidate-dock {

  .deconstructed.profile-selected { --candidate-dock-height: calc(var(--mode-switch-height) + var(--profile-rail-height)); }
  .deconstructed .candidate-dock-label {

  /* Index typographique des candidats, sans avatar ni carte. */
  .deconstructed .candidate-dock .rail-shell {

  .deconstructed .candidate-dock .avatar-carousel {

  .deconstructed .candidate-dock .rail-scroll-btn {

  .deconstructed .avatar-chip {

  .deconstructed .avatar-chip-circle { display: none; }
  .deconstructed .avatar-chip-name {
    max-width: none;
    overflow: visible;
    font-family: var(--font-family-mono);
    font-size: 0.75rem;
    color: var(--text);

  }
  .deconstructed .avatar-chip.active { color: white; background: var(--text); }
  .deconstructed .avatar-chip.active .avatar-chip-name { color: white; }
  .deconstructed .avatar-chip:disabled { text-decoration: line-through; }

  .deconstructed #candidat-root { position: relative; }
  .deconstructed .home-stage {
    min-height: var(--card-min-height-home-stage);

  .deconstructed .home-manifesto {

    margin: 0 0 0.6rem;
  }
  .deconstructed .home-manifesto p {
    max-width: 52ch;
    margin: 0;
    font-size: clamp(0.95rem, 1.8vw, 1.05rem);
    line-height: 1.45;
  }
  .deconstructed .home-candidates {
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-auto-rows: minmax(var(--card-min-height-candidate), auto);
    align-items: stretch;
  }
  .deconstructed .home-candidate {
    min-height: var(--card-min-height-candidate);
    padding: 0.8rem;
    border: 0;

  }
  .deconstructed .home-candidate:hover,
  .deconstructed .home-candidate:focus-visible { background: var(--acid); }
  .deconstructed .home-candidate strong { display: block; font-family: var(--font-family-display); font-size: clamp(1rem, 3vw, 1.6rem); }
  .deconstructed .home-candidate small { font-family: var(--font-family-mono); }
  .deconstructed .home-note { grid-column: 1 / -1; padding: 0.75rem 1rem; background: var(--accent); color: white; }
  .deconstructed .party-home-note { background: var(--pink); color: var(--text); }
  .deconstructed .party-profile { min-height: 70vh; }
  .deconstructed .party-hero {
    min-height: var(--card-min-height-group-hero);
    display: grid;
    align-content: end;
    padding: var(--panel-section-padding-fluid);
    border-bottom: var(--border-width) solid var(--line);
    color: var(--bg);
    background: var(--text);
  }
  .deconstructed .party-hero h2 {
    max-width: 10ch;
    margin: 0;
    color: var(--bg);
    font-size: clamp(2rem, 5vw, 3.2rem);
    line-height: 0.9;
    text-transform: uppercase;
    letter-spacing: -0.03em;
  }
  .deconstructed .party-coverage {
    padding: 0.9rem 1rem;
    border-bottom: var(--border-width) solid var(--line);
    background: var(--pink);
    font: 600 0.7rem/1.55 'IBM Plex Mono', monospace;
  }
  .deconstructed .party-kpis {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    align-items: stretch;
    border-bottom: var(--border-width) solid var(--line);
  }
  .deconstructed .party-kpi {
    min-height: var(--card-min-height-group-kpi);
    padding: var(--space-16);
    border-right: var(--border-width) solid var(--line);
    display: flex;
    flex-direction: column;
    justify-content: space-between;

  .deconstructed .party-kpi:nth-child(2) { background: var(--accent-soft); }
  .deconstructed .party-kpi:nth-child(3) { background: var(--acid); }
  .deconstructed .party-kpi:nth-child(4) { background: var(--pink); border-right: 0; }
  .deconstructed .party-kpi b { display: block; font: 400 clamp(2.4rem, 6vw, 5rem)/0.9 'Archivo Black', sans-serif; word-break: break-word; }
  .deconstructed .party-kpi span { font: 600 0.65rem/1.45 'IBM Plex Mono', monospace; text-transform: uppercase; }
  .deconstructed .party-section { padding: var(--panel-section-padding-fluid); border-bottom: var(--border-width) solid var(--line); }
  .deconstructed .party-section h2 { max-width: 12ch; font-size: var(--section-title-size-fluid); line-height: 0.88; }
  .deconstructed .party-vote-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    grid-auto-rows: minmax(var(--card-min-height-group-vote), auto);
    align-items: stretch;
    gap: 1px;
    border: 1px solid var(--line);
    background: var(--line);
  }
  .deconstructed .party-vote {
    min-height: var(--card-min-height-group-vote);
    padding: 0.8rem;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    justify-content: space-between;

  .deconstructed .party-vote-position { display: inline-block; padding: 0.25rem 0.4rem; color: white; background: var(--text); text-transform: uppercase; }
  .deconstructed .party-vote-position--pour { background: var(--vert); }
  .deconstructed .party-vote-position--contre { background: var(--rouge); }
  .deconstructed .party-vote-position--abstention,
  .deconstructed .party-vote-position--absent { background: var(--muted); }
  .deconstructed .party-tags { display: flex; flex-wrap: wrap; gap: 0; }
  .deconstructed .party-tag { padding: calc(0.45rem + var(--weight) * 0.25rem) 0.7rem; border: 1px solid var(--line); margin: 0 -1px -1px 0; background: var(--acid); }
  .deconstructed .party-tag b { font-size: calc(0.7rem + var(--weight) * 0.3rem); }
  .deconstructed .party-tag small { display: block; font: 0.55rem 'IBM Plex Mono', monospace; }
  .deconstructed .party-members {
    display: grid;

    justify-content: center;

    text-transform: uppercase;

  .deconstructed .tag { border-radius: var(--radius-none); border-color: var(--bg); background: transparent; color: var(--bg); }

  /* Les KPI sont des annotations asymétriques, pas quatre cartes homogènes. */

    display: grid;
    grid-template-columns: repeat(6, 1fr);
    grid-auto-rows: minmax(var(--card-min-height-summary), auto);
    align-items: stretch;
    gap: 0;
    margin: 0;
    border-bottom: var(--border-width) solid var(--line);
  }
  .deconstructed .kpi-flip { grid-column: span 3; perspective: none; border-right: var(--border-width) solid var(--line); }

  .deconstructed .kpi-flip-inner { min-height: var(--card-min-height-summary); transform-style: flat; transition: none; }
  .deconstructed .kpi-face { border: 0; border-radius: var(--radius-none); background: transparent; padding: var(--space-16); backface-visibility: visible; overflow: hidden; }
  /* Front face uses flow layout in deconstructed (no 3D flip) so the card grows with content. */
  .deconstructed .kpi-face--front {
    position: relative;
    inset: auto;
    height: auto;
    justify-content: space-between;
  }
  .deconstructed .kpi-face--back {
    transform: none;
    opacity: 0;
    background: var(--text);
    color: var(--bg);
    pointer-events: none;
  }
  .deconstructed .kpi-face--back .kpi-back-text { color: var(--bg); }
  .deconstructed .kpi-face--back .kpi-back-link { color: var(--acid); }
  .deconstructed .kpi-flip.flipped .kpi-flip-inner,
  .deconstructed .kpi-flip:focus-visible .kpi-flip-inner { transform: none; }
  .deconstructed .kpi-flip.flipped .kpi-face--front { opacity: 0; }
  .deconstructed .kpi-flip.flipped .kpi-face--back { opacity: 1; pointer-events: auto; }
  @media (hover: hover) {
    .deconstructed .kpi-flip:hover .kpi-flip-inner { transform: none; }
    .deconstructed .kpi-flip:hover .kpi-face--front { opacity: 0; }
    .deconstructed .kpi-flip:hover .kpi-face--back { opacity: 1; pointer-events: auto; }
  }
  .deconstructed .kpi-icon { color: currentColor; }
  .deconstructed .kpi-value {
    font-size: clamp(2rem, 7vw, 5rem);
    letter-spacing: -0.04em;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    word-break: break-word;
  }
  .deconstructed .kpi-label { color: currentColor; font-family: var(--font-family-mono); text-transform: uppercase; }
  .deconstructed .theme-dist { display: none; }
  .deconstructed .trust-line { border: 0; padding: 0.8rem 1rem; margin: 0; background: var(--accent); color: white; }
  .deconstructed .trust-line a { color: white; }
  .deconstructed .site-footer {
    padding: 0.9rem 1rem;
    border-top: var(--border-width) solid var(--line);
    font-family: var(--font-family-mono);
    font-size: 0.7rem;
    text-transform: uppercase;
  }
  .deconstructed .site-footer a { color: var(--text); }

  .deconstructed .theme-dock {
    position: sticky;
    top: var(--candidate-dock-height);
    z-index: 75;
    padding: 0.55rem 1rem;
    border-top: var(--border-width) solid var(--line);
    border-bottom: var(--border-width) solid var(--line);
    background: rgba(242, 240, 231, 0.96);
    backdrop-filter: blur(10px);
  }
  .deconstructed .theme-dock .section-kicker { margin: 0 0 0.3rem; }
  .deconstructed .themes-row { gap: 0; padding: 0; }
  .deconstructed .theme-pill,

    margin: 0 -1px -1px 0;
  }

  .deconstructed .ghost-btn.active-choice { background: var(--text); color: var(--bg); }

  /* Rail spatial: les sections sont des coordonnées, pas des onglets. */
  .deconstructed .panel-indicator {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 90;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 0;
    margin: 0;
    padding: 0;
    border-top: var(--border-width) solid var(--line);
    background: var(--bg);
  }
  .deconstructed .panel-dot {
    width: 100%;
    height: 64px;
    border: 0;

    const DEFAULT_THEME = "institutions";

    // Pictogrammes des cartes KPI (SVG inline, sans dépendance externe)
    const KPI_ICONS = {

    const state = {

    function setDocumentTitle(label) {
      document.title = label ? `Empreinte politique — ${label}` : "Empreinte politique — En clair";
    }

    function escapeHtml(str) {
      return String(str ?? "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;",
      })[c]);
    }

    function toDateMs(value) {
      if (!value) return 0;
      const t = Date.parse(value);
      return Number.isNaN(t) ? 0 : t;
    }

    function formatIsoDate(value) {
      if (!value) return "non renseignée";
      const d = new Date(value);
      if (Number.isNaN(d.getTime())) return value;
      return d.toLocaleDateString("fr-FR");
    }

    function shortName(name) {
      if (!name) return "?";
      return name
        .split(/\s+/)
        .filter(Boolean)
        .slice(0, 2)
        .map((part) => part.charAt(0).toUpperCase())
        .join("");
    }

    function simplifyTitle(text) {
      const raw = String(text || "").trim();
      if (!raw) return "Intitulé non renseigné";
      const cleaned = raw.replace(/^(la|le|les)\s+/i, "");
      return cleaned.length > TITLE_TRUNCATE_LENGTH ? `${cleaned.slice(0, TITLE_TRUNCATE_SLICE).trim()}…` : cleaned;
    }

    function normalizedText(...parts) {
      return parts
        .filter(Boolean)
        .join(" ")
        .toLowerCase();
    }

    function detectThemeFromText(text) {
      const t = String(text || "").toLowerCase();
      for (const [theme, needles] of Object.entries(THEME_RULES)) {
        if (needles.some((needle) => t.includes(needle))) return theme;
      }
      return DEFAULT_THEME;
    }

    function themeLabel(themeKey) {
      return THEME_OPTIONS.find((t) => t.key === themeKey)?.label || "Institutions";
    }

    function voteLabelAndClass(position) {
      const p = String(position || "").toLowerCase();
      if (p.includes("pour")) return { label: "Pour", cls: "pour" };
      if (p.includes("contre")) return { label: "Contre", cls: "contre" };
      if (p.includes("abst")) return { label: "Abstention", cls: "abstention" };
      if (NON_VOTING_PATTERN.test(p) || p.includes("absent")) {
        return { label: "Absent / non votant", cls: "absent" };
      }
      return { label: "Position non précisée", cls: "absent" };
    }

    // --- KPI de synthèse (voir analyse KPI : ancienneté, responsabilités, profil de vote, thème dominant) ---

    const MS_PER_YEAR = 365.25 * 24 * 3600 * 1000;
    const RESPONSIBILITY_CATEGORIES = ["commission", "extra_parlementaire", "groupe_amitie"];
    const ROLE_PRIORITY = [
      "président", "présidente", "co-président", "co-présidente",
      "vice-président", "vice-présidente", "rapporteur", "co-rapporteur", "rapporteure",
    ];
    const CATEGORIE_LABELS_FR = {
      mandat_electif: "Mandat électif",
      commission: "Commission / mission",
      extra_parlementaire: "Engagement extra-parlementaire",
      groupe_amitie: "Groupe d'amitié",
      groupe_politique: "Groupe politique",
      autre: "Autre responsabilité",
    };
    const MANDATE_FILTERS = {
      all: () => true,
      elective: (mandate) => mandate.categorie === "mandat_electif",
      responsibilities: (mandate) => !["mandat_electif", "groupe_politique", "groupe_amitie"].includes(mandate.categorie),
      groups: (mandate) => ["groupe_politique", "groupe_amitie"].includes(mandate.categorie),
    };

    // KPI 1 — Ancienneté et statut du mandat : ne mesure pas l'implication, seulement la durée.
    function computeMandateTenure(profile) {
      const electifs = (profile.mandats || []).filter((m) => m.categorie === "mandat_electif");
      const debuts = electifs.map((m) => toDateMs(m.debut)).filter(Boolean);
      if (!debuts.length) return null;
      const debutMin = Math.min(...debuts);
      const enCours = electifs.some((m) => m.actif);
      const fins = electifs.map((m) => toDateMs(m.fin)).filter(Boolean);
      const refEnd = enCours || !fins.length ? Date.now() : Math.max(...fins);
      const annees = Math.max(0, Math.round(((refEnd - debutMin) / MS_PER_YEAR) * 10) / 10);
      return { debutIso: new Date(debutMin).toISOString().slice(0, 10), annees, enCours };
    }

    // KPI 2 — Responsabilités institutionnelles : dédupliquées par intitulé pour ne pas
    // gonfler le chiffre avec des réaffectations administratives internes (churn de commissions).
    function bestRoleType(types) {
      for (const kw of ROLE_PRIORITY) {
        const match = types.find((t) => (t || "").toLowerCase().includes(kw));
        if (match) return match;
      }
      return types[0] || "membre";
    }

    function dedupeResponsibilities(profile) {
      const relevant = (profile.mandats || []).filter((m) => RESPONSIBILITY_CATEGORIES.includes(m.categorie));
      const byLabel = new Map();
      for (const m of relevant) {
        const key = m.label || "Responsabilité non précisée";
        if (!byLabel.has(key)) {
          byLabel.set(key, { label: key, categorie: m.categorie, types: [], debuts: [], fins: [], actif: false });
        }
        const entry = byLabel.get(key);
        entry.types.push(m.type);
        if (m.debut) entry.debuts.push(toDateMs(m.debut));
        if (m.fin) entry.fins.push(toDateMs(m.fin));
        if (m.actif) entry.actif = true;
      }
      return [...byLabel.values()]
        .map((e) => ({
          label: e.label,
          categorie: e.categorie,
          type: bestRoleType(e.types),
          debut: e.debuts.length ? new Date(Math.min(...e.debuts)).toISOString().slice(0, 10) : null,
          fin: e.actif ? null : (e.fins.length ? new Date(Math.max(...e.fins)).toISOString().slice(0, 10) : null),
          actif: e.actif,
        }))
        .sort((a, b) => {
          const notableDiff = Number(isNotableResponsibility(b)) - Number(isNotableResponsibility(a));
          return notableDiff || (b.debut || "").localeCompare(a.debut || "");
        });
    }

    function computeResponsibilitiesSummary(profile) {
      const items = dedupeResponsibilities(profile);
      return { distinctCount: items.length };
    }

    function isNotableResponsibility(responsibility) {
      return ROLE_PRIORITY.some((keyword) => (responsibility.type || "").toLowerCase().includes(keyword));
    }

    function sourcedHemicyclePosition(profile) {
      const mandate = (profile.pivot_mandats || []).find((item) => item.position_dans_hemicycle && item.source_url);
      return mandate?.position_dans_hemicycle || null;
    }

    function hemicyclePeriods(profile) {
      return (profile.pivot_mandats || [])
        .filter((item) => item.position_dans_hemicycle && item.source_url)
        .map((item) => ({
          position: item.position_dans_hemicycle,
          debutMs: toDateMs(item.debut),
          finMs: item.actif || !item.fin ? Number.POSITIVE_INFINITY : toDateMs(item.fin),
        }))
        .filter((period) => Number.isFinite(period.debutMs));
    }

    function classifyDateInHemicycle(dateIso, periods) {
      if (!dateIso || !periods.length) return "indetermine";
      const dateMs = toDateMs(dateIso);
      if (!Number.isFinite(dateMs)) return "indetermine";
      const matching = periods
        .filter((period) => dateMs >= period.debutMs && dateMs <= period.finMs)
        .map((period) => period.position);
      const hasMajorite = matching.includes("majorite");
      const hasOpposition = matching.includes("opposition");
      if (hasMajorite && hasOpposition) return "mixte";
      if (hasMajorite) return "majorite";
      if (hasOpposition) return "opposition";
      return "indetermine";
    }

    function classifyTexteInHemicycle(texte, periods) {
      if (!periods.length) return "indetermine";
      const anchors = [texte.date_max, texte.date_min].filter(Boolean);
      if (!anchors.length) return "indetermine";
      const labels = anchors.map((dateIso) => classifyDateInHemicycle(dateIso, periods));
      const hasMajorite = labels.includes("majorite");
      const hasOpposition = labels.includes("opposition");
      if (hasMajorite && hasOpposition) return "mixte";
      if (hasMajorite) return "majorite";
      if (hasOpposition) return "opposition";
      return labels[0] || "indetermine";
    }

    function splitLegislativeFactsByHemicycle(profile) {
      const periods = hemicyclePeriods(profile);
      const textesBuckets = {
        majorite: [], opposition: [], mixte: [], indetermine: [],
      };
      const amendementsBuckets = {
        majorite: [], opposition: [], mixte: [], indetermine: [],
      };
      for (const texte of (profile.textes_portes || [])) {
        const bucket = classifyTexteInHemicycle(texte, periods);
        textesBuckets[bucket]?.push(texte);
      }
      for (const amendement of (profile.amendements || [])) {
        const bucket = classifyDateInHemicycle(amendement.date, periods);
        amendementsBuckets[bucket]?.push(amendement);
      }
      return { periods, textesBuckets, amendementsBuckets };
    }

    function effectiveLegislativeReading(profile) {
      if (state.legislativeReadingMode !== "auto") return state.legislativeReadingMode;
      return sourcedHemicyclePosition(profile) || "neutral";
    }

    function renderLegislativeContext(profile) {
      const sourcedPosition = sourcedHemicyclePosition(profile);
      const reading = effectiveLegislativeReading(profile);
      const split = splitLegislativeFactsByHemicycle(profile);
      const statusLabel = sourcedPosition === "majorite"
        ? "Groupe majoritaire"
        : sourcedPosition === "opposition"
          ? "Groupe d’opposition"
          : "Position dans l’hémicycle non sourcée";
      const readingLabel = reading === "majorite"
        ? "Les textes portés sont présentés en premier; les amendements complètent la lecture."
        : reading === "opposition"
          ? "Les amendements sont présentés en premier; les textes portés complètent la lecture."
          : "Ordre neutre: textes portés puis amendements, sans hiérarchie politique inférée.";
      return `
        <div class="legislative-context">
          <div class="legislative-context-head">
            <span class="legislative-context-status">${escapeHtml(statusLabel)}</span>
            <span class="source-ref">${sourcedPosition ? "Position sourcée dans le mandat" : "Aucune position utilisée en mode Auto"}</span>
          </div>
          <p class="small">${escapeHtml(readingLabel)} L’ordre facilite la lecture; il ne mesure ni l’influence ni la performance.</p>
          ${split.periods.length ? `<p class="source-ref">Ventilation temporelle disponible: ${split.periods.length} période(s) sourcée(s) de position dans l’hémicycle.</p>` : `<p class="source-ref">Ventilation majorité/opposition indisponible: aucune période sourcée avec dates dans les mandats de cette fiche.</p>`}
          <div class="legislative-reading-controls" role="group" aria-label="Angle de lecture de l’activité législative">
            ${[
              ["auto", "Auto"],
              ["majorite", "Lecture majorité"],
              ["opposition", "Lecture opposition"],
            ].map(([mode, label]) => `<button type="button" data-legislative-reading="${mode}" aria-pressed="${state.legislativeReadingMode === mode}">${escapeHtml(label)}</button>`).join("")}
          </div>
          ${state.legislativeReadingMode !== "auto" ? `<p class="source-ref">Angle manuel: la position factuelle affichée ci-dessus reste inchangée.</p>` : ""}
        </div>
      `;
    }

    function filterTextesByReadingScope(profile, scope) {
      const themedTextes = (profile.textes_portes || []).filter((d) => inTheme(d, state.selectedTheme));
      if (scope === "all") return themedTextes;
      const split = splitLegislativeFactsByHemicycle(profile);
      if (!split.periods.length) return [];
      const allowed = new Set([...split.textesBuckets[scope], ...split.textesBuckets.mixte]);
      return themedTextes.filter((item) => allowed.has(item));
    }

    function filterAmendementsByReadingScope(profile, scope) {
      const amendements = profile.amendements || [];
      if (scope === "all") return amendements;
      const split = splitLegislativeFactsByHemicycle(profile);
      if (!split.periods.length) return [];
      const allowed = new Set([...split.amendementsBuckets[scope], ...split.amendementsBuckets.mixte]);
      return amendements.filter((item) => allowed.has(item));
    }

    function renderMinisterialIncompatibilities(profile) {
      const periods = (profile.pivot_mandats || [])
        .map((mandate) => mandate.suspendu_pour_fonction_gouvernementale)
        .filter(Boolean);
      if (!periods.length) return "";
      return `<div class="party-coverage">INCOMPATIBILITÉ MINISTÉRIELLE : ${periods.map((period) => (
        `mandat suspendu du ${escapeHtml(formatIsoDate(period.debut))} au ${escapeHtml(formatIsoDate(period.fin))}${period.suppleant_id ? ` · suppléant : ${escapeHtml(period.suppleant_id)}` : ""}`
      )).join(" · ")}. Cette période n’est pas interprétée comme une absence parlementaire.</div>`;
    }

    // KPI 3 — Profil de vote synthétique : une répartition, jamais un score isolé.
    // Univers retenu : tous les scrutins publics, ordinaires ou solennels, portant sur
    // "l'ensemble" du texte (pas les amendements/articles isolés,
    // où un "contre" reflète souvent un désaccord technique ponctuel plutôt qu'une opposition de
    // principe), et dédupliqué sur la lecture la plus avancée quand un même texte a été voté à
    // plusieurs stades (première lecture, nouvelle lecture, CMP, lecture définitive...).
    // Limite qui subsiste : un vote sur l'ensemble agrège quand même des motivations plurielles,
    // et le regroupement des lectures d'un même texte repose sur une similarité de titre (fragile
    // si le libellé change entre chambres). Une donnée manquante reste distincte d'une position.
    const ENSEMBLE_VOTE_PATTERN = /^l[’']ensemble\s+(?:du|de la)\s+(.*?)\s*(?:\(([^)]*)\))?\.?$/i;
    const READING_STAGE_RANK = {
      "lecture définitive": 4,
      "texte de la commission mixte paritaire": 3,
      "texte de la commission paritaire": 3,
      "nouvelle lecture": 2,
      "deuxième lecture": 2,
      "première lecture": 1,
      "premiere lecture": 1,
    };

    function readingStageRank(stage) {
      if (!stage) return 1;
      return READING_STAGE_RANK[stage.trim().toLowerCase()] ?? 1;
    }

    function parseEnsembleVote(titre) {
      const m = ENSEMBLE_VOTE_PATTERN.exec((titre || "").trim());
      if (!m) return null;
      return { key: m[1].trim().toLowerCase(), stage: m[2] || null, rank: readingStageRank(m[2]) };
    }

    function computeFinalTextVoteProfile(profile) {
      const votes = profile.votes || [];
      const groups = new Map();
      let totalLectures = 0;
      for (const v of votes) {
        if (v.type_vote === "motion_censure" || v.sort === "adopte_sans_vote_49_3") continue;
        const parsed = parseEnsembleVote(v.titre);
        if (!parsed) continue;
        totalLectures += 1;
        const current = groups.get(parsed.key);
        if (
          !current ||
          parsed.rank > current.rank ||
          (parsed.rank === current.rank && toDateMs(v.date) > toDateMs(current.vote.date))
        ) {
          groups.set(parsed.key, { rank: parsed.rank, vote: v });
        }
      }
      const counts = { pour: 0, contre: 0, abstention: 0, absent: 0 };
      for (const { vote } of groups.values()) {
        const cls = voteLabelAndClass(vote.position).cls;
        counts[cls] = (counts[cls] || 0) + 1;
      }
      const totalPositions = counts.pour + counts.contre + counts.abstention;
      return { totalTextes: groups.size, totalPositions, totalLectures, counts };
    }

    function renderResponsabilites(profile) {
      const items = dedupeResponsibilities(profile);
      if (!items.length) {
        return `<p class="empty">Aucune responsabilité institutionnelle retrouvée.</p>`;
      }
      return `
        <p class="orbit-legend">Jaune = présidence, vice-présidence ou rapport identifié · survoler / toucher pour détailler</p>
        <div class="orbit" aria-label="Constellation des responsabilités">${items.map((r, index) => `
        <button type="button" class="orbit-node ${isNotableResponsibility(r) ? "is-notable" : ""}" style="--tilt:${((index % 7) - 3) * 1.8}deg" aria-expanded="false">
          <strong>${escapeHtml(r.label)}</strong>
          <small>${escapeHtml(formatIsoDate(r.debut))} → ${r.fin ? escapeHtml(formatIsoDate(r.fin)) : (r.actif ? "aujourd’hui" : "fin non renseignée")}</small>
          <span class="orbit-detail"><span>
            <small>${escapeHtml(r.type || "membre")}</small>
            <small>${escapeHtml(CATEGORIE_LABELS_FR[r.categorie] || r.categorie)}</small>
            ${isNotableResponsibility(r) ? `<small>Rôle signalé comme responsabilité notable.</small>` : `<small>Participation comme membre.</small>`}
          </span></span>
        </button>
      `).join("")}</div>`;
    }

    function buildMandateTimeline(profile) {
      const dayMs = 24 * 60 * 60 * 1000;
      const dated = [];
      const undated = [];
      for (const mandate of (profile.pivot_mandats || [])) {
        const item = {
          ...mandate,
          sourceUrls: /^https?:\/\//.test(mandate.source_url || "") ? [mandate.source_url] : [],
        };
        (mandate.debut ? dated : undated).push(item);
      }
      dated.sort((a, b) => a.debut.localeCompare(b.debut) || String(a.fin || "").localeCompare(String(b.fin || "")));

      const merged = [];
      for (const mandate of dated) {
        const previous = merged.at(-1);
        const sameRole = previous
          && previous.label === mandate.label
          && previous.categorie === mandate.categorie
          && previous.fonction === mandate.fonction;
        const gap = sameRole && previous.fin ? toDateMs(mandate.debut) - toDateMs(previous.fin) : Number.POSITIVE_INFINITY;
        if (sameRole && gap >= 0 && gap <= dayMs) {
          previous.fin = mandate.fin;
          previous.actif = mandate.actif;
          previous.sourceUrls = [...new Set([...previous.sourceUrls, ...mandate.sourceUrls])];
        } else {
          merged.push(mandate);
        }
      }
      return merged
        .sort((a, b) => b.debut.localeCompare(a.debut) || String(b.fin || "").localeCompare(String(a.fin || "")))
        .concat(undated);
    }

    function renderMandateTimeline(profile) {
      const filter = MANDATE_FILTERS[state.mandateFilter] || MANDATE_FILTERS.all;
      const items = buildMandateTimeline(profile).filter(filter);
      if (!items.length) return `<p class="empty">Aucun mandat documenté pour ce filtre.</p>`;
      return `<div class="mandate-timeline">${items.map((mandate) => {
        const period = mandate.debut
          ? `${formatIsoDate(mandate.debut)} → ${mandate.actif ? "aujourd’hui" : (mandate.fin ? formatIsoDate(mandate.fin) : "fin non renseignée")}`
          : "date non renseignée";
        return `<article class="mandate-timeline-item">
          <div class="mandate-period">${escapeHtml(period)}</div>
          <div class="mandate-card ${mandate.categorie === "mandat_electif" ? "" : "is-dashed"} ${mandate.actif ? "is-current" : ""}">
            <strong class="mandate-function">${escapeHtml(mandate.fonction || "Fonction non renseignée")}</strong>
            <div class="mandate-detail">${escapeHtml(mandate.label || "Mandat non précisé")}</div>
            <small class="mandate-meta">${escapeHtml(CATEGORIE_LABELS_FR[mandate.categorie] || mandate.categorie || "Catégorie non renseignée")}</small>
            ${mandate.sourceUrls.length ? `<div class="mandate-sources">${mandate.sourceUrls.map((url, index) => `<a href="${escapeHtml(url)}" target="_blank" rel="noopener">Source${mandate.sourceUrls.length > 1 ? ` ${index + 1}` : ""}</a>`).join(" · ")}</div>` : ""}
          </div>
        </article>`;
      }).join("")}</div>`;
    }

    function renderMandates(profile) {
      const viewControls = `<div class="mandate-view-controls" role="group" aria-label="Vue des mandats">
        ${[["timeline", "Chronologie"], ["responsibilities", "Responsabilités"]].map(([value, label]) => (
          `<button type="button" class="${state.mandateView === value ? "active" : ""}" data-mandate-view="${value}" aria-pressed="${state.mandateView === value}">${label}</button>`
        )).join("")}
      </div>`;
      if (state.mandateView === "responsibilities") return `${viewControls}${renderResponsabilites(profile)}`;
      const filters = `<div class="mandate-filters" role="group" aria-label="Filtrer les mandats">
        ${[["all", "Tous"], ["elective", "Électifs"], ["responsibilities", "Responsabilités"], ["groups", "Groupes"]].map(([value, label]) => (
          `<button type="button" class="${state.mandateFilter === value ? "active" : ""}" data-mandate-filter="${value}" aria-pressed="${state.mandateFilter === value}">${label}</button>`
        )).join("")}
      </div>`;
      return `${viewControls}${filters}${renderMandateTimeline(profile)}`;
    }

    function withTheme(profile) {
      const votes = (profile.votes || []).map((v) => ({
        ...v,
        _theme: detectThemeFromText(normalizedText(v.titre, v.position)),
      }));
      const textesPortes = (profile.textes_portes || []).map((d) => ({
        ...d,
        _theme: detectThemeFromText(normalizedText(d.titre)),
      }));
      const interventions = (profile.interventions || []).map((i) => ({
        ...i,
        _theme: detectThemeFromText(normalizedText(i.sujet, i.texte, ...(i.mots_cles || []))),
      }));
      return { ...profile, votes, textes_portes: textesPortes, interventions };
    }

    function inTheme(item, selectedTheme) {
      return selectedTheme === "all" ? true : item._theme === selectedTheme;
    }

    function isPublicCarriedText(texte) {
      return Boolean(TEXT_ROLE_LABELS[texte.role] && DEBATED_TEXT_STAGES.has(texte.stade_procedural));
    }

    function publicCarriedTexts(profile) {
      return (profile.textes_portes || []).filter((texte) => isPublicCarriedText(texte));
    }

    function textExclusionReasons(texte) {
      const reasons = [];
      if (!TEXT_ROLE_LABELS[texte.role]) reasons.push("role factuel non renseigne");
      if (!DEBATED_TEXT_STAGES.has(texte.stade_procedural)) reasons.push("stade non retenu pour publication");
      return reasons.length ? reasons : ["hors criteres publics"];
    }

    function sourceLinkHtml(url, label = "Source officielle") {
      if (!url) return `<span class="small">${escapeHtml(label)} indisponible</span>`;
      return `<a class="link" href="${escapeHtml(url)}" target="_blank" rel="noopener">${escapeHtml(label)}</a>`;
    }

    function voteSourceUrl(profile, vote) {
      const directUrl = vote.url_source || vote.url || vote.source;
      if (/^https?:\/\//i.test(directUrl || "")) return { url: directUrl, direct: true };
      const legislature = String(profile.votes_source || "").match(/l[ée]gislature\s*(\d+)/i)?.[1]
        || (profile.textes_portes || []).find((item) => item.legislature)?.legislature;
      if (vote.numero_scrutin && legislature) {
        return {
          url: `https://www.assemblee-nationale.fr/dyn/${encodeURIComponent(legislature)}/scrutins/${encodeURIComponent(vote.numero_scrutin)}`,
          direct: true,
        };
      }
      const fallback = profile.synthese_activite?.url_an_ou_senat || profile.source;
      return /^https?:\/\//i.test(fallback || "") ? { url: fallback, direct: false } : null;
    }

    function compareFactsForTheme(profile, theme) {
      const votes = (profile.votes || []).filter((v) => v._theme === theme);
      const textes = publicCarriedTexts(profile).filter((d) => d._theme === theme);
      const interventions = (profile.interventions || []).filter((i) => i._theme === theme);
      return { votes, textes, interventions };
    }

    function renderThemePills() {
      return `
        <div class="themes-row" aria-label="Filtre des thèmes">
          ${THEME_OPTIONS.map((t) => `
            <button type="button" class="theme-pill ${state.selectedTheme === t.key ? "active" : ""}" data-theme="${t.key}">
              ${t.icon ? `<span aria-hidden="true">${t.icon}</span>` : ""}<span>${escapeHtml(t.label)}</span>
            </button>
          `).join("")}
        </div>
      `;
    }

    function renderHeader(meta, profile) {
      const nom = profile?.identite?.nom_complet || meta?.nom || profile?.slug || "Candidat";
      const parti = meta?.parti || profile?.identite?.groupe_nom || profile?.identite?.groupe_sigle || "Affiliation non renseignée";
      const statut = meta?.statut || "statut non renseigné";
      const photo = profile?.mandat_europeen?.photo || "";
      const updatedAt = profile?.meta?.genere_le || null;

      // KPI 1 — Ancienneté et statut du mandat
      const tenure = computeMandateTenure(profile);

      // KPI 2 — Responsabilités institutionnelles occupées (dédupliquées, hors churn administratif)
      const responsibilities = computeResponsibilitiesSummary(profile);

      // KPI 3 — Profil de vote synthétique, restreint aux votes sur l'ensemble du texte (dernière lecture connue)
      const voteProfile = computeFinalTextVoteProfile(profile);
      const voteProfilePct = (key) => (voteProfile.totalPositions > 0 ? Math.round((voteProfile.counts[key] / voteProfile.totalPositions) * 100) : 0);

      // Répartition thématique des votes pour histogramme horizontal (sert aussi de base au KPI 4)
      const themeCountMap = {};
      for (const v of (profile.votes || [])) {
        themeCountMap[v._theme] = (themeCountMap[v._theme] || 0) + 1;
      }
      const sortedThemeDist = Object.entries(themeCountMap)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 5);
      const maxThemeCount = sortedThemeDist[0]?.[1] || 1;

      const themeDistHtml = sortedThemeDist.length ? `
        <div class="theme-dist">
          <p class="theme-dist-title">Répartition des votes par thème</p>
          ${sortedThemeDist.map(([theme, count]) => `
            <div class="theme-dist-row">
              <span class="theme-dist-label">${escapeHtml(themeLabel(theme))}</span>
              <div class="theme-dist-bar-wrap" title="${escapeHtml(themeLabel(theme))} — ${count} vote(s)">
                <div class="theme-dist-bar" style="width:${Math.round((count / maxThemeCount) * 100)}%"></div>
              </div>
              <span class="theme-dist-count">${count}</span>
            </div>
          `).join("")}
        </div>
      ` : "";

      return `
        <section id="resume" class="panel">
          <div class="hero">
            <div class="avatar">${photo ? `<img src="${escapeHtml(photo)}" alt="Photo de ${escapeHtml(nom)}">` : escapeHtml(shortName(nom))}</div>
            <div>
              <h2>${escapeHtml(nom)}</h2>
              <div class="tags">
                <span class="tag">${escapeHtml(parti)}</span>
                <span class="tag">${escapeHtml(statut)}</span>
              </div>
              <button type="button" class="express-launch">Résumé express ▶</button>
            </div>
          </div>

          <div class="summary-grid">
            <div class="kpi-flip ${state.flippedKpis.has("anciennete") ? "flipped" : ""}" tabindex="0" role="button" aria-pressed="${state.flippedKpis.has("anciennete")}" data-kpi="anciennete" aria-label="Ancienneté du mandat, appuyer pour l'explication">
              <div class="kpi-flip-inner">
                <div class="kpi-face kpi-face--front">
                  <div class="kpi-icon">${KPI_ICONS.anciennete}</div>
                  <div class="kpi-value">${tenure ? `${tenure.annees}\u00a0${tenure.annees <= 1 ? "an" : "ans"}` : "N/D"}</div>
                  <div class="kpi-label">Ancienneté du mandat</div>
                </div>
                <div class="kpi-face kpi-face--back">
                  <p class="kpi-back-text">${tenure ? (tenure.enCours ? `En cours depuis le ${escapeHtml(formatIsoDate(tenure.debutIso))}.` : `Terminé, débuté le ${escapeHtml(formatIsoDate(tenure.debutIso))}.`) : "Mandat électif non renseigné."} Mesure la durée, pas l'implication.</p>
                </div>
              </div>
            </div>

            <div class="kpi-flip ${state.flippedKpis.has("responsabilites") ? "flipped" : ""}" tabindex="0" role="button" aria-pressed="${state.flippedKpis.has("responsabilites")}" data-kpi="responsabilites" aria-label="Responsabilités occupées, appuyer pour l'explication">
              <div class="kpi-flip-inner">
                <div class="kpi-face kpi-face--front">
                  <div class="kpi-icon">${KPI_ICONS.responsabilites}</div>
                  <div class="kpi-value">${responsibilities.distinctCount}</div>
                  <div class="kpi-label">Responsabilités occupées</div>
                </div>
                <div class="kpi-face kpi-face--back">
                  <p class="kpi-back-text">Commissions et engagements distincts, hors réaffectations internes. Les fonctions ordonnent le détail, mais ne produisent aucun total public de « responsabilités notables ».</p>
                  <button type="button" class="kpi-back-link" data-goto-panel="mandats">Voir le détail →</button>
                </div>
              </div>
            </div>

            <div class="kpi-flip ${state.flippedKpis.has("vote") ? "flipped" : ""}" tabindex="0" role="button" aria-pressed="${state.flippedKpis.has("vote")}" data-kpi="vote" aria-label="Profil de vote, appuyer pour l'explication">
              <div class="kpi-flip-inner">
                <div class="kpi-face kpi-face--front">
                  <div class="kpi-icon">${KPI_ICONS.vote}</div>
                  <div class="kpi-value">${voteProfile.totalPositions > 0 ? `${voteProfilePct("pour")}\u00a0%` : "N/D"}</div>
                  <div class="kpi-label">Profil de vote — part de "pour"</div>
                </div>
                <div class="kpi-face kpi-face--back">
                  ${voteProfile.totalPositions > 0 ? `
                    <div class="vote-profile-bar" role="img" aria-label="Répartition des positions documentées : ${voteProfilePct("pour")}% pour, ${voteProfilePct("contre")}% contre, ${voteProfilePct("abstention")}% abstention">
                      <div class="vote-profile-seg--pour" style="width:${voteProfilePct("pour")}%"></div>
                      <div class="vote-profile-seg--contre" style="width:${voteProfilePct("contre")}%"></div>
                      <div class="vote-profile-seg--abstention" style="width:${voteProfilePct("abstention")}%"></div>
                    </div>
                    <div class="vote-profile-legend">
                      <span><span class="dot dot--pour"></span>Pour ${voteProfilePct("pour")}%</span>
                      <span><span class="dot dot--contre"></span>Contre ${voteProfilePct("contre")}%</span>
                      <span><span class="dot dot--abstention"></span>Abst. ${voteProfilePct("abstention")}%</span>
                    </div>
                    <p class="kpi-back-text">${voteProfile.totalPositions} position(s) documentée(s) sur des textes entiers, à leur lecture la plus avancée. Scrutins publics ordinaires et solennels; motions de censure et 49.3 sans vote exclus. Pas un score de performance.</p>
                  ` : `<p class="kpi-back-text">Aucun vote sur l'ensemble d'un texte retrouvé dans les données disponibles.</p>`}
                  <button type="button" class="kpi-back-link" data-goto-panel="votes">Voir le détail →</button>
                </div>
              </div>
            </div>

            <div class="kpi-flip ${state.flippedKpis.has("theme") ? "flipped" : ""}" tabindex="0" role="button" aria-pressed="${state.flippedKpis.has("theme")}" data-kpi="theme" aria-label="Thème dominant, appuyer pour l'explication">
              <div class="kpi-flip-inner">
                <div class="kpi-face kpi-face--front">
                  <div class="kpi-icon">${KPI_ICONS.theme}</div>
                  <div class="kpi-value">${sortedThemeDist.length ? escapeHtml(themeLabel(sortedThemeDist[0][0])) : "N/D"}</div>
                  <div class="kpi-label">Thème dominant</div>
                </div>
                <div class="kpi-face kpi-face--back">
                  <p class="kpi-back-text">${sortedThemeDist.length ? `${sortedThemeDist[0][1]} vote(s) sur ce thème.` : "Thème non déterminé."} Classification par mots-clés : une tendance, pas un classement exhaustif.</p>
                  <button type="button" class="kpi-back-link" data-goto-panel="votes">Voir le détail →</button>
                </div>
              </div>
            </div>
          </div>

          <aside class="color-legend" aria-label="Légende des couleurs utilisées">
            <span class="color-legend-item"><span class="color-swatch color-swatch--acid"></span>Jaune — accent actif</span>
            <span class="color-legend-item"><span class="color-swatch color-swatch--pink"></span>Rose — signal éditorial</span>
            <span class="color-legend-item"><span class="color-swatch color-swatch--soft"></span>Bleu — repère secondaire</span>
            <span class="color-legend-item"><span class="color-swatch color-swatch--vert"></span>Vert — vote pour</span>
            <span class="color-legend-item"><span class="color-swatch color-swatch--rouge"></span>Rouge — vote contre</span>
            <span class="color-legend-item"><span class="color-swatch color-swatch--muted"></span>Gris — abstention</span>
          </aside>

          ${themeDistHtml}

          <div class="trust-line">
            Données sourcées • Mise à jour le ${escapeHtml(formatIsoDate(updatedAt))} •
            <a class="link" href="methodologie.html" target="_blank" rel="noopener">Voir la méthode</a>
            <a class="link" href="mentions-legales.html" target="_blank" rel="noopener">Mentions légales</a>
          </div>
        </section>
      `;
    }

    function renderTextes(profile, scope = "all") {
      const themedTextes = filterTextesByReadingScope(profile, scope);
      const items = themedTextes.filter((d) => isPublicCarriedText(d));
      const excludedItems = themedTextes.filter((d) => !isPublicCarriedText(d));
      const noSplitData = scope !== "all" && !hemicyclePeriods(profile).length;
      if (!items.length) {
        if (noSplitData) {
          return `<p class="empty">Impossible de distinguer les textes entre majorité et opposition pour cette fiche: aucune période sourcée de position dans l’hémicycle n’est disponible.</p>`;
        }
        if (!excludedItems.length) {
          return `<p class="empty">${state.selectedTheme === "all" ? "Aucun texte avec rôle factuel et débat avéré retrouvé." : "Aucun texte répondant aux critères sur ce thème."} Un simple dépôt ou un rôle inconnu n’est pas publié ici.</p>`;
        }

        const sortedExcluded = [...excludedItems].sort((a, b) => {
          const dateDiff = toDateMs(b.date_max || b.date_min) - toDateMs(a.date_max || a.date_min);
          return dateDiff || simplifyTitle(a.titre).localeCompare(simplifyTitle(b.titre), "fr");
        });
        return `
          <p class="source-ref">Aucun texte publiable avec les criteres actuels. ${sortedExcluded.length} texte(s) existent dans la source mais sont exclus de la publication.</p>
          <div class="text-fallback-grid">
            ${sortedExcluded.map((d) => `
              <article class="text-fallback-item">
                <div class="text-fallback-title">${escapeHtml(simplifyTitle(d.titre) || "Titre non renseigne")}</div>
                <div class="small">${escapeHtml(formatIsoDate(d.date_min))}${d.date_max ? ` → ${escapeHtml(formatIsoDate(d.date_max))}` : ""}</div>
                <div>
                  ${textExclusionReasons(d).map((reason) => `<span class="text-fallback-reason">${escapeHtml(reason)}</span>`).join("")}
                </div>
                ${sourceLinkHtml(d.source_url, "↗ source")}
              </article>
            `).join("")}
          </div>
        `;
      }
      const sorted = [...items].sort((a, b) => {
        const dateDiff = toDateMs(b.date_max || b.date_min) - toDateMs(a.date_max || a.date_min);
        return dateDiff || simplifyTitle(a.titre).localeCompare(simplifyTitle(b.titre), "fr");
      });
      const byTheme = new Map();
      for (const item of sorted) {
        if (!byTheme.has(item._theme)) byTheme.set(item._theme, []);
        byTheme.get(item._theme).push(item);
      }
      const shelves = [...byTheme.entries()].sort((a, b) => {
        const countDiff = b[1].length - a[1].length;
        if (countDiff) return countDiff;
        const newestDiff = toDateMs(b[1][0]?.date_max || b[1][0]?.date_min) - toDateMs(a[1][0]?.date_max || a[1][0]?.date_min);
        return newestDiff || themeLabel(a[0]).localeCompare(themeLabel(b[0]), "fr");
      });

      return `<p class="source-ref">Sont retenus les textes dont le rôle est sourcé et qui ont au moins été examinés en commission.</p><div class="text-atlas">${shelves.map(([theme, themeItems]) => {
        const expanded = state.expandedTextThemes.has(theme);
        const visible = expanded ? themeItems : themeItems.slice(0, 6);
        return `
          <section class="text-shelf" aria-labelledby="text-theme-${escapeHtml(theme)}">
            <div class="text-shelf-head">
              <strong id="text-theme-${escapeHtml(theme)}">${escapeHtml(themeLabel(theme))}</strong>
              <span></span>
              <span class="text-shelf-count">${themeItems.length} texte(s)</span>
            </div>
            <div class="text-shelf-track">
              ${visible.map((d) => `
                <article class="text-leaf">
                  <div class="text-leaf-title">${escapeHtml(simplifyTitle(d.titre))}</div>
                  <div>
                    <div class="text-leaf-meta">${escapeHtml(TEXT_ROLE_LABELS[d.role])} / ${escapeHtml(TEXT_STAGE_LABELS[d.stade_procedural])} / ${escapeHtml(formatIsoDate(d.date_min))}${d.date_max ? ` → ${escapeHtml(formatIsoDate(d.date_max))}` : ""}</div>
                    ${sourceLinkHtml(d.source_url, "↗ source")}
                  </div>
                </article>
              `).join("")}
            </div>
            ${themeItems.length > 6 ? `<button type="button" class="text-shelf-more" data-expand-text-theme="${escapeHtml(theme)}">${expanded ? "Réduire" : `Voir les ${themeItems.length} textes`} ${escapeHtml(themeLabel(theme))}</button>` : ""}
          </section>
        `;
      }).join("")}</div>${excludedItems.length ? `
        <div class="text-unpublished-bar">
          <button type="button" class="text-unpublished-toggle" data-toggle-unpublished-textes aria-expanded="${state.showUnpublishedTextes}">

          </button>
        </div>
        ${state.showUnpublishedTextes ? `<div class="text-fallback-grid">${[...excludedItems].sort((a, b) => toDateMs(b.date_max || b.date_min) - toDateMs(a.date_max || a.date_min) || simplifyTitle(a.titre).localeCompare(simplifyTitle(b.titre), "fr")).map((d) => `
          <article class="text-fallback-item">
            <div class="text-fallback-title">${escapeHtml(simplifyTitle(d.titre) || "Titre non renseigné")}</div>
            <div class="small">${escapeHtml(formatIsoDate(d.date_min))}${d.date_max ? ` → ${escapeHtml(formatIsoDate(d.date_max))}` : ""}</div>
            <div>${textExclusionReasons(d).map((reason) => `<span class="text-fallback-reason">${escapeHtml(reason)}</span>`).join("")}</div>
            ${sourceLinkHtml(d.source_url, "↗ source")}
