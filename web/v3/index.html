    function renderAmendements(profile, scope = "all") {
      const amendements = filterAmendementsByReadingScope(profile, scope);
      const noSplitData = scope !== "all" && !hemicyclePeriods(profile).length;
      if (noSplitData) {
        return `<p class="empty">Impossible de distinguer les amendements entre majorité et opposition pour cette fiche: aucune période sourcée de position dans l’hémicycle n’est disponible.</p>`;
      }
      if (!amendements.length) return `<p class="empty">Aucun amendement structuré disponible.</p>`;
      const counts = Object.fromEntries(AMENDMENT_OUTCOMES.map(([outcome]) => [outcome, 0]));
      for (const amendement of amendements) {
        if (Object.hasOwn(counts, amendement.sort)) counts[amendement.sort] += 1;
      }
      return `
        <p class="source-ref">Comptes bruts par issue sur ${amendements.length} amendement(s) documenté(s). Aucun taux isolé : l’issue dépend aussi de la procédure et du texte.</p>
        <div class="void-map">${AMENDMENT_OUTCOMES.map(([outcome, label]) => `
          <div class="void-signal"><span class="void-number">${counts[outcome]}</span><strong>${escapeHtml(label)}</strong></div>
        `).join("")}</div>
      `;
    }

    function sortVotesByDate(votes) {
      return [...votes].sort((a, b) => {
        const dateDiff = toDateMs(b.date) - toDateMs(a.date);
        return dateDiff || simplifyTitle(a.titre).localeCompare(simplifyTitle(b.titre), "fr");
      });
    }

    function renderVotes(profile) {
      const items = (profile.votes || []).filter((v) => inTheme(v, state.selectedTheme));
      if (!items.length) {
        return `<p class="empty">${state.selectedTheme === "all" ? "Aucune donnée de vote trouvée dans cette fiche." : "Aucune donnée de vote trouvée sur ce thème."}</p>`;
      }

      const motions = items.filter((vote) => vote.type_vote === "motion_censure");
      const fortyNineThree = items.filter((vote) => vote.sort === "adopte_sans_vote_49_3");
      const ordinaryVotes = items.filter((vote) => vote.type_vote !== "motion_censure" && vote.sort !== "adopte_sans_vote_49_3");
      const byTheme = new Map();
      for (const vote of ordinaryVotes) {
        if (!byTheme.has(vote._theme)) byTheme.set(vote._theme, []);
        byTheme.get(vote._theme).push(vote);
      }
      const shelves = [...byTheme.entries()]
        .map(([theme, votes]) => [theme, sortVotesByDate(votes)])
        .sort((a, b) => {
          const countDiff = b[1].length - a[1].length;
          return countDiff || themeLabel(a[0]).localeCompare(themeLabel(b[0]), "fr");
        });

      return `
        ${fortyNineThree.length ? `<div class="party-coverage"><strong>49.3, sans vote sur le texte</strong><br>${fortyNineThree.map((vote) => `${escapeHtml(simplifyTitle(vote.titre))} · ${escapeHtml(formatIsoDate(vote.date))}`).join("<br>")}</div>` : ""}
        ${motions.length ? `<div class="party-coverage"><strong>Motions de censure, scrutins séparés</strong><br>${motions.map((vote) => {
          const badge = voteLabelAndClass(vote.position);
          return `${escapeHtml(simplifyTitle(vote.titre))} · ${escapeHtml(badge.label)} · ${escapeHtml(formatIsoDate(vote.date))}${vote.texte_lie_id ? ` · texte lié ${escapeHtml(vote.texte_lie_id)}` : ""}`;
        }).join("<br>")}</div>` : ""}
        <p class="source-ref">Dans chaque thème : du vote le plus récent au plus ancien.</p>
        <div class="vote-atlas">
          ${shelves.map(([theme, themeVotes]) => {
            const expanded = state.expandedVoteThemes.has(theme);
            const visible = expanded ? themeVotes : themeVotes.slice(0, 18);
            return `
              <section class="vote-shelf" aria-labelledby="vote-theme-${escapeHtml(theme)}">
                <div class="vote-shelf-head">
                  <strong id="vote-theme-${escapeHtml(theme)}">${escapeHtml(themeLabel(theme))}</strong>
                  <span></span>
                  <span class="vote-shelf-count">${themeVotes.length} vote(s)</span>
                </div>
                <div class="vote-cloud">
                  ${visible.map((v, index) => {
                    const badge = voteLabelAndClass(v.position);
                    const weight = 1 + (index % 5);
                    const source = voteSourceUrl(profile, v);
                    const tagName = source ? "a" : "span";
                    const sourceAttrs = source ? `href="${escapeHtml(source.url)}" target="_blank" rel="noopener"` : "";
                    return `<${tagName} class="vote-token ${badge.cls}" style="--weight:${weight}" title="${escapeHtml(v.titre || "")}" ${sourceAttrs}>
                      ${escapeHtml(simplifyTitle(v.titre))}
                      <em>${escapeHtml(badge.label)} / ${escapeHtml(formatIsoDate(v.date))}${source ? `<span class="source-mark">↗ ${source.direct ? "scrutin" : "profil source"}</span>` : ""}</em>
                    </${tagName}>`;
                  }).join("")}
                </div>
                ${themeVotes.length > 18 ? `<button type="button" class="vote-shelf-more" data-expand-vote-theme="${escapeHtml(theme)}">${expanded ? "Réduire" : `Voir les ${themeVotes.length} votes`} ${escapeHtml(themeLabel(theme))}</button>` : ""}
              </section>
            `;
          }).join("")}
        </div>
      `;
    }

    function renderAbsences(profile) {
      const textes = publicCarriedTexts(profile).filter((d) => inTheme(d, state.selectedTheme));
      const inters = (profile.interventions || []).filter((i) => inTheme(i, state.selectedTheme));

      const themeUniverse = THEME_OPTIONS.filter((t) => t.key !== "all").map((t) => t.key);

      let noTextThemes = [];
      let noInterThemes = [];
      if (state.selectedTheme === "all") {
        const textThemes = new Set(publicCarriedTexts(profile).map((d) => d._theme));
        const interThemes = new Set((profile.interventions || []).map((i) => i._theme));
        noTextThemes = themeUniverse.filter((t) => !textThemes.has(t));
        noInterThemes = themeUniverse.filter((t) => !interThemes.has(t));
      }

      const missingTextCount = state.selectedTheme === "all" ? noTextThemes.length : (textes.length ? 0 : 1);
      const missingInterCount = state.selectedTheme === "all" ? noInterThemes.length : (inters.length ? 0 : 1);
      return `<div class="void-map">
        <div class="void-signal"><span class="void-number">${missingTextCount}</span><strong>thème(s) sans texte retrouvé</strong><small>${noTextThemes.map(themeLabel).join(" / ") || "aucun vide détecté"}</small></div>
        <div class="void-signal"><span class="void-number">${missingInterCount}</span><strong>thème(s) sans parole retrouvée</strong><small>${noInterThemes.map(themeLabel).join(" / ") || "aucun vide détecté"}</small></div>
      </div>`;
    }

    function renderInterventions(profile) {
      let items = (profile.interventions || []).filter((i) => inTheme(i, state.selectedTheme));
      if (state.interventionsMode === "short") {
        items = items.filter((i) => i.format === "reaction_courte");
      } else if (state.interventionsMode === "long") {
        items = items.filter((i) => i.format === "prise_de_parole_developpee");
      }

      if (!items.length) {
        return `<p class="empty">${state.selectedTheme === "all" ? "Aucune prise de parole trouvée." : "Aucune prise de parole retrouvée sur ce thème dans les données actuellement disponibles."}</p>`;
      }

      const sorted = [...items].sort((a, b) => toDateMs(b.date || b.created_at) - toDateMs(a.date || a.created_at));
      const visible = sorted.slice(0, state.interventionsVisible);

      return `
        <div class="inter-controls">
          <button type="button" class="ghost-btn ${state.interventionsMode === "all" ? "active-choice" : ""}" data-inter-mode="all">Toutes</button>
          <button type="button" class="ghost-btn ${state.interventionsMode === "short" ? "active-choice" : ""}" data-inter-mode="short">Réactions courtes</button>
          <button type="button" class="ghost-btn ${state.interventionsMode === "long" ? "active-choice" : ""}" data-inter-mode="long">Prises de parole longues</button>
        </div>

        <div class="speech-tape">
          ${visible.map((i) => `
            <article class="speech-fragment">
              <div class="editorial-meta">${escapeHtml(formatIsoDate(i.date || i.created_at))} / ${escapeHtml(themeLabel(i._theme))}</div>
              <p class="speech-quote">“${escapeHtml(i.texte ? String(i.texte).slice(0, INTERVENTION_TEXT_PREVIEW_LENGTH) : (i.sujet || "Extrait non disponible"))}${i.texte && String(i.texte).length > INTERVENTION_TEXT_PREVIEW_LENGTH ? "…" : ""}”</p>
              <div>${sourceLinkHtml(i.url_detail || i.url, "↗ archive")}</div>

          `).join("")}
        </div>

        ${sorted.length > visible.length ? `<p><button type="button" id="see-more-interventions" class="ghost-btn">Voir plus d’extraits</button></p>` : ""}
      `;
    }

    async function loadProfile(slug) {
      if (!slug) return null;
      const [rawResponse, pivotResponse] = await Promise.all([
        fetch(PROFILE_URL(slug), { cache: "no-store" }),
        fetch(PIVOT_PROFILE_URL(slug), { cache: "no-store" }).catch(() => null),
      ]);
      if (!rawResponse.ok) throw new Error(`HTTP ${rawResponse.status}`);
      const raw = await rawResponse.json();
      const pivot = pivotResponse?.ok ? await pivotResponse.json() : null;
      const pivotVotes = new Map((pivot?.votes || []).map((vote) => [String(vote.numero_scrutin || ""), vote]));
      const votes = (raw.votes || []).map((vote) => {
        const fact = pivotVotes.get(String(vote.numero_scrutin || ""));
        return fact ? { ...vote, type_scrutin: fact.type_scrutin, type_vote: fact.type_vote, texte_lie_id: fact.texte_lie_id, sort: fact.sort ?? vote.sort } : vote;
      });
      return withTheme({
        ...raw,
        votes,
        textes_portes: pivot?.textes_portes || [],
        amendements: pivot?.amendements || [],
        pivot_mandats: pivot?.mandats || [],
      });
    }

    async function ensureCompareProfile(slug) {
      if (!slug) return null;
      if (state.compareProfiles[slug]) return state.compareProfiles[slug];
      try {
        state.compareProfiles[slug] = await loadProfile(slug);
      } catch {
        state.compareProfiles[slug] = null;
      }
      return state.compareProfiles[slug];
    }

      const baseTheme = state.selectedTheme === "all" ? state.compareTheme : state.selectedTheme;

    function average(values) {
      const valid = values
        .filter((value) => value !== null && value !== undefined && value !== "" && Number.isFinite(Number(value)))
        .map(Number);
      return valid.length ? valid.reduce((sum, value) => sum + value, 0) / valid.length : null;
    }

    function formatPercentage(value) {
      return !Number.isFinite(value) ? "N/D" : `${Math.round(value * 100)} %`;
    }

      const root = document.getElementById("candidat-root");

      if (!group) return;
      const title = group.groupe_nom || group.groupe_sigle || "Groupe parlementaire";

      const periodeLabel = periode.debut
        ? `${formatIsoDate(periode.debut)} → ${periode.fin ? formatIsoDate(periode.fin) : "aujourd'hui"}${periode.actif ? "" : " (groupe dissous)"}`

      const coverage = group.meta?.couverture_roster || {};

              <div class="party-member"><strong>${escapeHtml(member.nom)}</strong><br><small>${member.actif ? "Membre actif" : `Membre du ${formatIsoDate(member.debut_dans_groupe)} au ${formatIsoDate(member.fin_dans_groupe)}`}</small></div>
            `).join("")}</div>` : `<p class="empty">Aucun profil pivot local disponible pour ce groupe.</p>`}
            <div class="party-sources">Généré le ${escapeHtml(formatIsoDate(group.meta?.genere_le))} · ${group.sources?.length || 0} source(s) déclarée(s) · <a href="methodologie.html" target="_blank" rel="noopener">Voir la méthode ↗</a></div>
          </section>
        </article>
      `;
      root.querySelectorAll("[data-expand-cohesion]").forEach((button) => {
        button.addEventListener("click", () => {
          state.realGroupCohesionVisible += 20;
          renderRealGroupPage();
        });
      });
      updateStickyLayoutVars();
      setDocumentTitle(title);
    }

    function renderPage() {
      const root = document.getElementById("candidat-root");
      const profile = state.currentProfile;
      const meta = state.currentMeta;

      if (!profile || !meta) {
        root.innerHTML = "";
        return;
      }

      const readingPosition = effectiveLegislativeReading(profile);
      const readingScope = state.legislativeReadingMode === "auto" ? "all" : state.legislativeReadingMode;
      const scopedTextes = filterTextesByReadingScope(profile, readingScope);
      const publicTextsCount = scopedTextes.filter((d) => isPublicCarriedText(d)).length;
      const excludedTextsCount = Math.max(0, scopedTextes.length - publicTextsCount);
      const amendmentsCount = filterAmendementsByReadingScope(profile, readingScope).length;
      const textsPrimary = readingPosition === "majorite";
      const amendmentsPrimary = readingPosition === "opposition";
      const textsBlock = `
        <section class="legislative-block ${textsPrimary ? "is-primary" : ""}">
          <div class="legislative-block-head">
            <div><p class="section-kicker">${textsPrimary ? "Signal principal dans cet angle" : "Signal complémentaire"}</p><h2>Textes portés</h2></div>
            <div class="legislative-block-badges"><span class="legislative-badge">${publicTextsCount} publiable(s)</span>${excludedTextsCount ? `<span class="legislative-badge">${excludedTextsCount} hors critères</span>` : ""}</div>
          </div>
          <div id="textes">${renderTextes(profile, readingScope)}</div>
        </section>`;
      const amendmentsBlock = `
        <section class="legislative-block ${amendmentsPrimary ? "is-primary" : ""}">
          <div class="legislative-block-head">
            <div><p class="section-kicker">${amendmentsPrimary ? "Signal principal dans cet angle" : "Signal complémentaire"}</p><h2>Amendements</h2></div>
            <div class="legislative-block-badges"><span class="legislative-badge">${amendmentsCount} documenté(s)</span><span class="legislative-badge">comptes bruts</span></div>
          </div>
          <div id="amendements">${renderAmendements(profile, readingScope)}</div>
        </section>`;
      const legislativeBlocks = readingPosition === "opposition"
        ? `${amendmentsBlock}${textsBlock}`
        : `${textsBlock}${amendmentsBlock}`;

      root.innerHTML = `
        ${renderHeader(meta, profile)}

        <section class="theme-dock">
          <p class="section-kicker">Filtrer par thème</p>
          ${renderThemePills()}
        </section>

        ${renderPanelIndicator()}
        <div class="swipe-deck" id="swipe-deck">
          <div class="swipe-panel ${state.activePanelIndex === 0 ? "active" : ""}">
            <section class="panel">
              <h2>Mandats documentés <span class="source-ref">(${(profile.pivot_mandats || []).length})</span></h2>
              ${renderMinisterialIncompatibilities(profile)}
              <div id="mandats">${renderMandates(profile)}</div>
            </section>
          </div>

          <div class="swipe-panel ${state.activePanelIndex === 1 ? "active" : ""}">
            <section class="panel">
              ${renderLegislativeContext(profile)}
              ${legislativeBlocks}
            </section>
          </div>

          <div class="swipe-panel ${state.activePanelIndex === 2 ? "active" : ""}">
            <section class="panel">
              <h2>Votes enregistrés <span class="source-ref">(${(profile.votes || []).length})</span></h2>
              <div id="votes">${renderVotes(profile)}</div>
            </section>
          </div>

          <div class="swipe-panel ${state.activePanelIndex === 3 ? "active" : ""}">
            <section class="panel">
              <h2>Angles morts documentaires</h2>
              <div id="absences">${renderAbsences(profile)}</div>
            </section>
          </div>

          <div class="swipe-panel ${state.activePanelIndex === 4 ? "active" : ""}">
            <section class="panel">
              <h2>Prises de parole <span class="source-ref">(${(profile.interventions || []).length})</span></h2>
              <div id="interventions">${renderInterventions(profile)}</div>
            </section>
          </div>

          <div class="swipe-panel ${state.activePanelIndex === 5 ? "active" : ""}">${renderCompareSection(profile)}</div>
        </div>
        <p class="swipe-hint">← Glissez ou touchez les icônes pour changer de section →</p>
        ${renderExpressSummary(profile)}
      `;

      setDocumentTitle(profile.identite?.nom_complet || meta.nom);
      bindRenderedEvents();
      updateStickyLayoutVars();
    }

    function expressSummaryData(profile) {
      const tenure = computeMandateTenure(profile);
      const responsibilities = computeResponsibilitiesSummary(profile);
      const voteProfile = computeFinalTextVoteProfile(profile);
      const pourPct = voteProfile.totalPositions
        ? Math.round((voteProfile.counts.pour / voteProfile.totalPositions) * 100)
        : null;
      const themeCounts = new Map();
      for (const item of [...(profile.votes || []), ...publicCarriedTexts(profile), ...(profile.interventions || [])]) {
        themeCounts.set(item._theme, (themeCounts.get(item._theme) || 0) + 1);
      }
      const dominant = [...themeCounts.entries()].sort((a, b) => b[1] - a[1])[0];
      return [
        {
          question: "Depuis combien de temps exerce-t-il un mandat parlementaire ?",
          value: tenure ? `${tenure.annees} ans` : "N/D",
          note: "Durée du mandat, pas mesure de l'implication.",
        },
        {
          question: "Quelles responsabilités institutionnelles a-t-il occupées ?",
          value: String(responsibilities.distinctCount),
          note: "Responsabilités distinctes, hors réaffectations administratives.",
        },
        {
          question: "Comment vote-t-il sur les textes entiers ?",
          value: pourPct === null ? "N/D" : `${pourPct} %`,
          note: voteProfile.totalPositions ? `${voteProfile.totalPositions} positions documentées, scrutins publics ordinaires et solennels.` : "Aucune position finale retrouvée.",
        },
        {
          question: "Quel thème apparaît le plus souvent dans ses traces ?",
          value: dominant ? themeLabel(dominant[0]) : "N/D",
          note: dominant ? `${dominant[1]} traces classées. Une fréquence documentaire, pas une priorité déclarée.` : "Thème non déterminé.",
        },
      ];
    }

    function renderExpressSummary(profile) {
      return `
        <div class="express-summary" role="dialog" aria-modal="true" aria-label="Résumé express" aria-hidden="true">
          <button type="button" class="express-summary-close" aria-label="Fermer">×</button>
          <div class="express-summary-scenes">
            ${expressSummaryData(profile).map((item, index) => `
              <section class="express-summary-scene ${index === state.expressIndex ? "active" : ""}">
                <h2 class="express-summary-question">${escapeHtml(item.question)}</h2>
                <div class="express-summary-answer"><b>${escapeHtml(item.value)}</b><span>${escapeHtml(item.note)}</span></div>
              </section>
            `).join("")}
          </div>
          <div class="express-summary-progress"><i style="width:${(state.expressIndex + 1) * 25}%"></i></div>
          <nav class="express-summary-nav" aria-label="Navigation du résumé">
            <button type="button" data-express-dir="-1" aria-label="Précédent">←</button>
            <button type="button" data-express-dir="1" aria-label="Suivant">→</button>
          </nav>
        </div>
      `;
    }

    function setExpressScene(index) {
      state.expressIndex = (index + 4) % 4;
      document.querySelectorAll(".express-summary-scene").forEach((scene, sceneIndex) => {
        scene.classList.toggle("active", sceneIndex === state.expressIndex);
      });
      const progress = document.querySelector(".express-summary-progress i");
      if (progress) progress.style.width = `${(state.expressIndex + 1) * 25}%`;
    }

    function openExpressSummary() {
      state.expressIndex = 0;
      setExpressScene(0);
      const summary = document.querySelector(".express-summary");
      summary?.classList.add("open");
      summary?.setAttribute("aria-hidden", "false");
      document.body.classList.add("express-open");
      document.querySelector(".express-summary-close")?.focus();
    }

    function closeExpressSummary() {
      const summary = document.querySelector(".express-summary");
      summary?.classList.remove("open");
      summary?.setAttribute("aria-hidden", "true");
      document.body.classList.remove("express-open");
      document.querySelector(".express-launch")?.focus();
    }

    function renderPanelIndicator() {
      return `
        <div class="panel-indicator" role="tablist" aria-label="Sections du dossier">
          ${PANEL_ORDER.map((id, i) => `
            <button type="button" class="panel-dot ${state.activePanelIndex === i ? "active" : ""}" data-panel-index="${i}" title="${escapeHtml(PANEL_META[id].label)}" aria-label="${escapeHtml(PANEL_META[id].label)}">
              <span aria-hidden="true">${PANEL_META[id].icon}</span>
              <small>${escapeHtml(PANEL_META[id].label)}</small>
            </button>
          `).join("")}
        </div>
      `;
    }

    function toggleKpiFlip(el) {
      const id = el.dataset.kpi;
      const flipped = el.classList.toggle("flipped");
      el.setAttribute("aria-pressed", String(flipped));
      if (flipped) state.flippedKpis.add(id); else state.flippedKpis.delete(id);
    }

    function setActivePanel(index, { scroll = false } = {}) {
      if (index < 0 || index >= PANEL_ORDER.length) return;
      state.activePanelIndex = index;
      document.querySelectorAll(".panel-dot").forEach((dot, i) => {
        dot.classList.toggle("active", i === index);
      });
      document.querySelectorAll(".swipe-panel").forEach((panel, i) => {
        panel.classList.toggle("active", i === index);
      });
      if (scroll) document.getElementById("swipe-deck")?.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function scrollToPanel(id) {
      setActivePanel(PANEL_ORDER.indexOf(id), { scroll: true });
    }

    function bindRenderedEvents() {
      document.querySelector(".express-launch")?.addEventListener("click", openExpressSummary);
      document.querySelector(".express-summary-close")?.addEventListener("click", closeExpressSummary);
      document.querySelectorAll("[data-express-dir]").forEach((button) => {
        button.addEventListener("click", () => setExpressScene(state.expressIndex + Number(button.dataset.expressDir)));
      });

      document.querySelectorAll("[data-expand-vote-theme]").forEach((button) => {
        button.addEventListener("click", () => {
          const theme = button.dataset.expandVoteTheme;
          if (state.expandedVoteThemes.has(theme)) state.expandedVoteThemes.delete(theme);
          else state.expandedVoteThemes.add(theme);
          renderPage();
        });
      });

      document.querySelectorAll("[data-expand-text-theme]").forEach((button) => {
        button.addEventListener("click", () => {
          const theme = button.dataset.expandTextTheme;
          if (state.expandedTextThemes.has(theme)) state.expandedTextThemes.delete(theme);
          else state.expandedTextThemes.add(theme);
          renderPage();
        });
      });

      document.querySelector("[data-toggle-unpublished-textes]")?.addEventListener("click", () => {
        state.showUnpublishedTextes = !state.showUnpublishedTextes;
        renderPage();
      });

      document.querySelectorAll("[data-legislative-reading]").forEach((button) => {
        button.addEventListener("click", () => {
          state.legislativeReadingMode = button.dataset.legislativeReading;
          renderPage();
        });
      });

      document.querySelectorAll(".orbit-node").forEach((node) => {
        node.addEventListener("click", () => {
          const expanded = node.classList.toggle("expanded");
          node.setAttribute("aria-expanded", String(expanded));
        });

        document.querySelectorAll("[data-mandate-view]").forEach((button) => {
          button.addEventListener("click", () => {
            state.mandateView = button.dataset.mandateView;
            renderPage();
          });
        });

        document.querySelectorAll("[data-mandate-filter]").forEach((button) => {
          button.addEventListener("click", () => {
            state.mandateFilter = button.dataset.mandateFilter;
            renderPage();
          });
        });
      });

      document.querySelectorAll("[data-theme]").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.selectedTheme = btn.dataset.theme;
          if (state.selectedTheme !== "all") state.compareTheme = state.selectedTheme;
          renderPage();
        });
      });

      document.querySelectorAll("[data-compare-theme]").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.compareTheme = btn.dataset.compareTheme;
          renderPage();
        });
      });

      document.querySelectorAll("[data-inter-mode]").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.interventionsMode = btn.dataset.interMode;
          state.interventionsVisible = 6;
          renderPage();
        });
      });

      const moreBtn = document.getElementById("see-more-interventions");
      if (moreBtn) {
        moreBtn.addEventListener("click", () => {
          state.interventionsVisible += 6;
          renderPage();
        });
      }

      document.querySelectorAll("[data-compare-toggle]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const slug = btn.dataset.compareToggle;
          const idx = state.compareSlugs.indexOf(slug);
          if (idx !== -1) {
            state.compareSlugs[idx] = "";
          } else {
            const emptyIdx = state.compareSlugs.indexOf("");
            state.compareSlugs[emptyIdx !== -1 ? emptyIdx : 0] = slug;
          }
          await refreshCompareProfiles();
          renderPage();
        });
      });

      // Cartes KPI en flip 3D : clic/tap pour basculer (le survol suffit sur desktop)
      document.querySelectorAll(".kpi-flip").forEach((el) => {
        el.addEventListener("click", (e) => {
          if (e.target.closest(".kpi-back-link")) return;
          toggleKpiFlip(el);
        });
        el.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            toggleKpiFlip(el);
          }
        });
      });
      document.querySelectorAll(".kpi-back-link").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          scrollToPanel(btn.dataset.gotoPanel);
        });
      });

      // Barre d'onglets : un seul panneau visible, sans défilement horizontal forcé.
      document.querySelectorAll(".panel-dot").forEach((dot) => {
        dot.addEventListener("click", () => {
          setActivePanel(Number(dot.dataset.panelIndex), { scroll: true });
        });
      });
    }

    async function refreshCompareProfiles() {
      // Dédoublonnage utile si la même personne est choisie deux fois pour la comparaison.
      const slugs = [...new Set(state.compareSlugs.filter(Boolean))].slice(0, MAX_COMPARE_CANDIDATES);
      state.compareSlugs = [slugs[0] || "", slugs[1] || ""];
      await Promise.all(slugs.map((slug) => ensureCompareProfile(slug)));
    }

    function updateActiveAvatarChip() {
      const carousel = document.getElementById("candidat-carousel");
      if (!carousel) return;
      document.querySelectorAll("#candidat-carousel .avatar-chip").forEach((chip) => {
        let isActive;
        if (state.profileMode === "groups") isActive = chip.dataset.realGroupId === state.currentRealGroupId;
        else isActive = chip.dataset.slug === state.currentSlug;
        chip.classList.toggle("active", isActive);
        chip.setAttribute("aria-selected", String(isActive));
      });
    }

    function updateStickyLayoutVars() {
      const dock = document.querySelector(".candidate-dock");
      const themeDock = document.querySelector(".theme-dock");
      const measuredDockHeight = dock ? dock.offsetHeight : 0;
      document.body.style.setProperty("--candidate-dock-height", `${measuredDockHeight}px`);
      document.body.style.setProperty("--theme-dock-height", `${themeDock ? themeDock.offsetHeight : 0}px`);
    }

    function updateProfileRailVisibility() {
      const carousel = document.getElementById("candidat-carousel");
      const dock = document.querySelector(".candidate-dock");
      const button = document.getElementById("rail-scroll-btn");
      let hasSelection;
      if (state.profileMode === "groups") hasSelection = Boolean(state.currentRealGroupId);
      else hasSelection = Boolean(state.currentSlug);
      carousel.hidden = !hasSelection;
      button.hidden = !hasSelection;
      dock.classList.toggle("has-profile-rail", hasSelection);
      document.body.classList.toggle("profile-selected", hasSelection);
      updateStickyLayoutVars();
      if (!hasSelection) return;
      const needsScroll = carousel.scrollWidth > carousel.clientWidth + 1;
      button.hidden = !needsScroll;
      updateStickyLayoutVars();
    }

    function scrollProfileRail() {
      const carousel = document.getElementById("candidat-carousel");
      if (!carousel) return;
      const step = Math.max(160, carousel.clientWidth * 0.8);
      carousel.scrollBy({ left: step, behavior: "smooth" });
    }

    function renderProfileRail() {
      const carousel = document.getElementById("candidat-carousel");
      if (!carousel) return;
      if (state.profileMode === "groups") {
        carousel.setAttribute("aria-label", "Choisir un groupe parlementaire");
        carousel.innerHTML = REAL_GROUP_PROFILES.map((group) => `
          <button type="button" class="avatar-chip" data-real-group-id="${escapeHtml(group.id)}" role="tab" aria-selected="false" title="${escapeHtml(group.label)} (${escapeHtml(group.chambre)})">
            <span class="avatar-chip-circle">${escapeHtml(shortName(group.label))}</span>
            <span class="avatar-chip-name">${escapeHtml(group.label)}</span>
          </button>
        `).join("");
        carousel.querySelectorAll("[data-real-group-id]").forEach((chip) => {
          chip.addEventListener("click", () => selectRealGroup(chip.dataset.realGroupId));
        });
      } else {
        carousel.setAttribute("aria-label", "Choisir un candidat");
        carousel.innerHTML = state.candidats.map((candidate) => `
          <button type="button" class="avatar-chip" data-slug="${escapeHtml(candidate.slug || "")}" role="tab" aria-selected="false" ${candidate.slug ? "" : "disabled"} title="${candidate.slug ? escapeHtml(candidate.nom) : `${escapeHtml(candidate.nom)} (pas de données parlementaires)`}">
            <span class="avatar-chip-circle">${escapeHtml(shortName(candidate.nom))}</span>
            <span class="avatar-chip-name">${escapeHtml(candidateLastName(candidate.nom))}</span>
          </button>
        `).join("");
        carousel.querySelectorAll(".avatar-chip[data-slug]:not(:disabled)").forEach((chip) => {
          chip.addEventListener("click", () => selectCandidate(chip.dataset.slug));
        });
      }
      updateActiveAvatarChip();
      updateProfileRailVisibility();
    }

    function setProfileMode(mode) {
      if (!['candidates', 'groups'].includes(mode) || state.profileMode === mode) return;
      state.profileMode = mode;
      state.currentSlug = "";
      state.currentMeta = null;
      state.currentProfile = null;
      state.currentRealGroupId = "";
      state.currentRealGroupProfile = null;
      document.querySelectorAll("[data-profile-mode]").forEach((button) => {
        const active = button.dataset.profileMode === mode;
        button.classList.toggle("active", active);
        button.setAttribute("aria-pressed", String(active));
      });
      renderProfileRail();
      renderHome();
    }

    async function selectCandidate(slug) {
      state.currentSlug = slug;
      state.currentMeta = state.candidats.find((c) => c.slug === slug) || null;
      state.currentProfile = null;
      state.selectedTheme = "all";
      state.interventionsMode = "all";
      state.interventionsVisible = 6;
      state.compareSlugs = ["", ""];
      state.compareProfiles = {};
      state.activePanelIndex = 0;
      state.flippedKpis = new Set();
      state.expandedTextThemes = new Set();
      state.expandedVoteThemes = new Set();
      state.showUnpublishedTextes = false;
      state.legislativeReadingMode = "auto";
      state.mandateView = "timeline";
      state.mandateFilter = "all";
      state.expressIndex = 0;

      updateActiveAvatarChip();
      updateProfileRailVisibility();

      const root = document.getElementById("candidat-root");
      if (!slug || !state.currentMeta) {
        root.innerHTML = "";
        setDocumentTitle("");
        return;
      }
      state.availableCompareCandidates = state.candidats.filter((c) => c.slug && c.slug !== slug);

      root.innerHTML = `<section class="panel"><p class="empty" role="status" aria-live="polite">Chargement de la fiche de ${escapeHtml(state.currentMeta.nom)}…</p></section>`;
      try {
        state.currentProfile = await loadProfile(slug);
        renderPage();
      } catch (err) {
        root.innerHTML = `
          <section class="panel">
            <p class="empty">Données non disponibles pour ce candidat (${escapeHtml(err.message)}).</p>
            <p class="small">Aucune donnée trouvée pour le moment. Cette fiche sera affichée dès que les données seront disponibles.</p>
          </section>
        `;
        setDocumentTitle(state.currentMeta?.nom || "");
      }
    }

    async function selectRealGroup(groupId) {
      state.currentRealGroupId = groupId;
      state.currentRealGroupProfile = null;
      state.realGroupCohesionVisible = 20;
      updateActiveAvatarChip();
      updateProfileRailVisibility();
      const root = document.getElementById("candidat-root");
      const groupMeta = REAL_GROUP_PROFILES.find((group) => group.id === groupId);
      if (!groupMeta) {
        renderRealGroupHome();
        return;
      }
      root.innerHTML = `<section class="panel"><p class="empty" role="status" aria-live="polite">Chargement du groupe ${escapeHtml(groupMeta.label)}…</p></section>`;
      try {
        const response = await fetch(REAL_GROUP_PROFILE_URL(groupMeta.fichier), { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const profile = await response.json();
        if (profile.type_document !== "profil_groupe") throw new Error("schéma de profil inattendu");
        state.currentRealGroupProfile = profile;
        renderRealGroupPage();
      } catch (error) {
        root.innerHTML = `<section class="panel"><p class="empty">Données de groupe indisponibles (${escapeHtml(error.message)}).</p></section>`;
        setDocumentTitle(groupMeta.label);
      }
    }

    function candidateLastName(nom) {
      const parts = String(nom || "").split(/\s+/).filter(Boolean);
      return parts.length ? parts[parts.length - 1] : "?";
    }

    async function init() {
      document.getElementById("home-link").addEventListener("click", renderHome);
      document.querySelectorAll("[data-profile-mode]").forEach((button) => {
        button.addEventListener("click", () => setProfileMode(button.dataset.profileMode));
      });
      document.getElementById("rail-scroll-btn").addEventListener("click", scrollProfileRail);
      window.addEventListener("resize", updateProfileRailVisibility);

      try {
        const resp = await fetch(CANDIDATS_URL, { cache: "no-store" });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json();
        state.candidats = data.candidats || [];
        renderProfileRail();
        renderHome();
      } catch (err) {
        document.getElementById("candidat-root").innerHTML = `
          <section class="panel"><p class="empty">Impossible de charger la liste des candidats (${escapeHtml(err.message)}).</p></section>
        `;
        return;
      }

    }

    init();
    document.addEventListener("keydown", (event) => {
      if (!document.querySelector(".express-summary.open")) return;
      if (event.key === "Escape") closeExpressSummary();
      if (event.key === "ArrowRight") setExpressScene(state.expressIndex + 1);
      if (event.key === "ArrowLeft") setExpressScene(state.expressIndex - 1);
    });
  </script>
</body>
</html>
